name: ci
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run it replaces: three pushes in
# four minutes used to keep three full sets of jobs busy. A push to main takes a
# group named after its own run, so every main run finishes and none waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        # Windows runs the unit and e2e sessions four to five times slower than
        # Ubuntu, so each Windows session is a job of its own and the two run
        # side by side. Ubuntu keeps both sessions in one job.
        suite: ["unit e2e", unit, e2e]
        exclude:
          # dogfood runs this exact source suite with coverage and checks JUnit.
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            suite: unit
          - os: ubuntu-latest
            suite: e2e
          - os: windows-latest
            suite: unit e2e
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The dev extra is the whole install: the suite's fixture lanes shell out
      # to pytest with plugin flags, so anything they spell has to arrive here.
      # Quoted because zsh globs the bare `.[dev]` and pip never sees the extra.
      - run: pip install -e ".[dev]"
      # An editable install puts the console script on PATH, and `crapkit` is
      # the form everything outward-facing spells: the packet hands agents
      # `crapkit rescore ... --gate`, .pre-commit-hooks.yaml runs
      # `crapkit hook-precommit`, and the plugin's hook handlers and .mcp.json
      # spawn the bare exe. A packaging change that stops installing it breaks
      # all four with no test failure, so this line is the test.
      - name: the console script resolves
        run: crapkit --version
      - run: python tools/testing/run.py --suite ${{ matrix.suite }}

  # The verdict compares installed base and candidate wheels. Each side builds,
  # installs and measures its own wheel in a job of its own, the two side by
  # side, and hands off its coverage evidence, the wheel and a proof of both. A
  # failing suite still hands off; the join decides what it means. A measurement
  # that stops hands off failure.json instead, with the phase and the error.
  verdict-measure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        side: [base, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: measure one installed wheel
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/testing/ci.py --base "$BASE_REF" --measure ${{ matrix.side }}
      - name: hand the measurement to the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crapkit-measure-${{ matrix.side }}
          # Handed to the verdict job inside this same run and read nowhere
          # else, so one day outlives every consumer it has.
          retention-days: 1
          path: .crapkit/ci-measure/${{ matrix.side }}
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true

  # The join installs each uploaded wheel into a fresh venv, proves again that
  # it holds that checkout's source, and runs verify over the uploaded evidence.
  verdict:
    needs: verdict-measure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: crapkit-measure-base
          path: .crapkit/ci-measure/base
      - uses: actions/download-artifact@v4
        with:
          name: crapkit-measure-candidate
          path: .crapkit/ci-measure/candidate
      - name: judge the two measured wheels
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/testing/ci.py --base "$BASE_REF" --join
      # Calculation accuracy over the same two wheels (docs/accuracy.md), whatever
      # the join decided: change control judges the diff against the last main
      # commit whose verdict was green, so a push that skipped CI is still judged;
      # the wheel diff names every value the candidate moves on the small corpus;
      # the floor proves the candidate's own lane measured every CLI entry point.
      # A side that handed off failure.json makes the first two print one skip line.
      - name: install the accuracy push tier's pinned tools
        if: ${{ !cancelled() }}
        run: python -m pip install --require-hashes --no-deps -r tools/accuracy/requirements-push.txt
      - name: change control against the last green main commit
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git fetch --quiet origin "+refs/accuracy/green:refs/accuracy/green"; then
            base=refs/accuracy/green
          else
            base="$BASE_REF"
            echo "no refs/accuracy/green yet: change control judges against the event base"
          fi
          python tools/accuracy/change_control.py --base "$base" --measured .crapkit/ci-measure
      - name: the two wheels on the small corpus
        if: ${{ !cancelled() }}
        run: >-
          python tools/accuracy/wheel_diff.py diff --corpus small
          --base-wheel .crapkit/ci-measure/base --candidate-wheel .crapkit/ci-measure/candidate
      - name: the candidate's lane measured every CLI entry point
        if: ${{ !cancelled() && hashFiles('.crapkit/ci-measure/candidate/cov/py.json') != '' }}
        env:
          CRAPKIT_SELF_MEASURE: .crapkit/ci-measure/candidate/cov/py.json
          CRAPKIT_ACCURACY_TIER: release
          PYTHONPATH: tests
        run: >-
          python -m pytest -q -p no:cacheprovider -p no:randomly
          tests/accuracy/suite_strength/test_self_measure_floor.py::test_cli_entry_points_measured
      - name: retain the verdict and wheel provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crapkit-verdict
          retention-days: 7
          path: .crapkit/ci-verdict
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true

  # The calculation-accuracy push tier (docs/accuracy.md): every number, label,
  # ranking and pass/fail crapkit computes, checked against an outside oracle,
  # a hand table or a clean-room model. Ubuntu runs every push check; Windows
  # runs only the checks whose answer can change with the OS (`os_sensitive` in
  # tools/accuracy/checks): byte decoding, PowerShell's parser, path spellings,
  # the gates in a temporary repo, argv splitting, printed commands and the
  # small-corpus exports. Both hand their receipt to accuracy-xplat.
  accuracy-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, select: "", minutes: 10}
          - {os: windows-latest, select: "--os-sensitive", minutes: 8}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The hash-locked tier, then crapkit from this checkout without its
      # dependencies: the lock already pins lizard and everything else.
      - run: python -m pip install --require-hashes --no-deps -r tools/accuracy/requirements-push.txt
      - run: python -m pip install --no-deps -e .
      - id: node
        uses: actions/cache@v4
        with:
          path: tools/accuracy/node/push/node_modules
          key: node-push-${{ runner.os }}-${{ hashFiles('tools/accuracy/node/push/package-lock.json') }}
      - if: steps.node.outputs.cache-hit != 'true'
        run: npm ci --prefix tools/accuracy/node/push --ignore-scripts --no-audit --no-fund
      - name: the push tier
        shell: bash
        run: >-
          python tools/accuracy/run.py --tier push -n 4 ${{ matrix.select }}
          --receipt .crapkit/accuracy/receipts/push-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-push-${{ runner.os }}
          path: .crapkit/accuracy/receipts/
          retention-days: 1

  # The small corpus's exports as each OS printed them: ints and labels exactly,
  # four-decimal floats by their text, full-precision floats within 2 ulp. A
  # difference names the export, the row and the column.
  accuracy-xplat:
    needs: accuracy-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --no-deps -r tools/accuracy/requirements-push.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: accuracy-push-*
          path: receipts
          merge-multiple: true
      - run: python tools/accuracy/wheel_diff.py xplat receipts/push-Linux.json receipts/push-Windows.json

  # A push to main whose verdict and accuracy jobs all passed becomes
  # refs/accuracy/green, the base the next change-control run judges against;
  # the ref only moves forward along main. A red one opens or updates the one
  # open `accuracy-red` issue.
  accuracy-green:
    needs: [verdict, accuracy-push, accuracy-xplat]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: move refs/accuracy/green to this commit
        if: ${{ needs.verdict.result == 'success' && needs.accuracy-push.result == 'success' && needs.accuracy-xplat.result == 'success' }}
        shell: bash
        run: |
          if git fetch --quiet origin "+refs/accuracy/green:refs/accuracy/green" &&
             ! git merge-base --is-ancestor refs/accuracy/green "$GITHUB_SHA"; then
            echo "refs/accuracy/green is already past $GITHUB_SHA; it stays"
            exit 0
          fi
          git push --force origin "$GITHUB_SHA:refs/accuracy/green"
      - name: file the red run under accuracy-red
        if: ${{ needs.verdict.result != 'success' || needs.accuracy-push.result != 'success' || needs.accuracy-xplat.result != 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: verdict ${{ needs.verdict.result }}, accuracy-push ${{ needs.accuracy-push.result }}, accuracy-xplat ${{ needs.accuracy-xplat.result }}
        run: |
          body="main at $GITHUB_SHA: $RESULTS. Run: $RUN_URL"
          number=$(gh issue list --label accuracy-red --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "accuracy-red: a push to main failed its accuracy verdict" --label accuracy-red --body "$body"
          fi

  # `plugin validate` reads hooks.json and the skill frontmatter, which no Python
  # test can schema-check: a malformed handler fails here with exit 1. The two
  # calls read two different files. `validate plugin` reads
  # plugin/.claude-plugin/plugin.json; `validate .` reads the repo-root
  # .claude-plugin/marketplace.json, which is what a `claude plugin marketplace
  # add JeanFrancoisGagne/crapkit` fetches, and nothing else checks it.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: the plugin manifest, hooks and skills validate
        run: claude plugin validate plugin --strict
      - name: the marketplace manifest validates
        run: claude plugin validate .

  # The composite action at the repo root is the one surface no Python test can
  # execute: `action.yml` is read by the runner, never imported. So crapkit runs
  # it on crapkit, on every push and every pull request, and a step that breaks
  # breaks here rather than in a consumer's job. `uses: ./` takes the working
  # copy, so the action a pull request changes is the action this job runs.
  #
  # The dev extra goes in first, and with the same python the action selects:
  # the action installs crapkit and nothing else, and crapkit.toml's `py` lane
  # shells out to `pytest --cov`, which is pytest-cov's flag and pytest's
  # runner. Without them the lane writes no artifact and the comment has no run
  # to describe.
  #
  # The verdict job compares isolated wheel installations. This job exercises
  # the composite action and owns Ubuntu/Python 3.12 source tests. The explicit
  # JUnit check below rejects failures even though the action stays advisory.
  dogfood:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: the console script resolves
        run: crapkit --version
      # delta stays false, and crapkit is the repo that has to say why. The
      # delta run scores the base commit in a worktree of its own, and the `py`
      # lane there spells `--cov=crapkit`, which the action's editable install
      # of this checkout resolves to this checkout. So the base run would
      # measure HEAD's source while standing on the base commit. `crapkit
      # coverage` refuses that artifact (exit 5) and the verdict falls back, so
      # what turning it on would buy is one wasted suite run per pull request.
      - name: discard prior action test evidence
        run: python -c "from pathlib import Path; Path('.crapkit/cov/junit.xml').unlink(missing_ok=True)"
      - name: crapkit scores itself through its own action
        uses: ./
        with:
          gate: "false"
          delta: "false"
          top: "5"
          python-version: "3.12"
      - name: require the action's complete passing test suite
        run: >-
          python -c "from pathlib import Path; from crapkit.junitparse import failed_test_ids;
          failed = sorted(failed_test_ids(Path('.crapkit/cov/junit.xml').read_text(encoding='utf-8')));
          print('\n'.join(failed)); raise SystemExit(bool(failed))"
      - name: gate changed functions against the event base
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m crapkit hook-precommit --base "$BASE_REF"
      - name: retain the action's test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crapkit-dogfood-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            .crapkit/cov/*.xml
            .crapkit/cov/**/*.log
            .crapkit/lane-*.log
          include-hidden-files: true
          if-no-files-found: warn
