name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The dev extra is the whole install: the suite's fixture lanes shell out
      # to pytest with plugin flags, so anything they spell has to arrive here.
      # Quoted because zsh globs the bare `.[dev]` and pip never sees the extra.
      - run: pip install -e ".[dev]"
      # An editable install puts the console script on PATH, and `crapkit` is
      # the form everything outward-facing spells: the packet hands agents
      # `crapkit rescore ... --gate`, .pre-commit-hooks.yaml runs
      # `crapkit hook-precommit`, and the plugin's hook handlers and .mcp.json
      # spawn the bare exe. A packaging change that stops installing it breaks
      # all four with no test failure, so this line is the test.
      - name: the console script resolves
        run: crapkit --version
      # Two commands, not one `pytest`: the suites want different settings.
      # tests/unit is in-process and serial, so a failure reproduces where it
      # fell.
      - run: python -m pytest tests/unit
      # tests/e2e drives the CLI against a throwaway git repo per test, which is
      # subprocess time that parallelises: about 8 minutes serial against about
      # 1m30 at `-n 8`, same 595 tests, same result. Those are developer-machine
      # numbers, not this runner's; the PR template and pyproject.toml quote the
      # same pair. pytest-xdist comes from the dev extra above.
      - run: python -m pytest -n 8 tests/e2e
      # The gate reads staged blobs and a fresh checkout stages nothing, so what
      # this proves is that the hook runs clean against the repo's own
      # crapkit.toml on a bare install. `|| true` hid even a crash; the tree
      # passes the gate with every file staged, so the exit code can stand.
      - name: gate the diff crapkit-style
        run: python -m crapkit hook-precommit

  # `plugin validate` reads hooks.json and the skill frontmatter, which no Python
  # test can schema-check: a malformed handler fails here with exit 1. The two
  # calls read two different files. `validate plugin` reads
  # plugin/.claude-plugin/plugin.json; `validate .` reads the repo-root
  # .claude-plugin/marketplace.json, which is what a `claude plugin marketplace
  # add JeanFrancoisGagne/crapkit` fetches, and nothing else checks it.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: the plugin manifest, hooks and skills validate
        run: claude plugin validate plugin --strict
      - name: the marketplace manifest validates
        run: claude plugin validate .

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: crapkit scores itself
        run: |
          python -m crapkit coverage --json > coverage.json
          python -m crapkit verify --json > verdict.json || true
          python -m crapkit worklist --top 5
