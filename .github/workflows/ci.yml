name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The dev extra is the whole install: the suite's fixture lanes shell out
      # to pytest with plugin flags, so anything they spell has to arrive here.
      # Quoted because zsh globs the bare `.[dev]` and pip never sees the extra.
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      # The gate reads staged blobs and a fresh checkout stages nothing, so what
      # this proves is that the hook runs clean against the repo's own
      # crapkit.toml on a bare install. `|| true` hid even a crash; the tree
      # passes the gate with all 298 files staged, so the exit code can stand.
      - name: gate the diff crapkit-style
        run: python -m crapkit hook-precommit

  # `plugin validate` reads hooks.json and the skill frontmatter, which no Python
  # test can schema-check: a malformed handler fails here with exit 1. It does not
  # read the repo-root marketplace.json, so `validate .` joins this step only once
  # that file exists (it lands after the CLI is on PyPI, on purpose).
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: the plugin manifest, hooks and skills validate
        run: claude plugin validate plugin --strict

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: crapkit scores itself
        run: |
          python -m crapkit coverage --json > coverage.json
          python -m crapkit verify --json > verdict.json || true
          python -m crapkit worklist --top 5
