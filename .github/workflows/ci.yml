name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        # dogfood runs this exact source suite with coverage and checks JUnit.
        exclude:
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The dev extra is the whole install: the suite's fixture lanes shell out
      # to pytest with plugin flags, so anything they spell has to arrive here.
      # Quoted because zsh globs the bare `.[dev]` and pip never sees the extra.
      - run: pip install -e ".[dev]"
      # An editable install puts the console script on PATH, and `crapkit` is
      # the form everything outward-facing spells: the packet hands agents
      # `crapkit rescore ... --gate`, .pre-commit-hooks.yaml runs
      # `crapkit hook-precommit`, and the plugin's hook handlers and .mcp.json
      # spawn the bare exe. A packaging change that stops installing it breaks
      # all four with no test failure, so this line is the test.
      - name: the console script resolves
        run: crapkit --version
      - run: python tools/testing/run.py

  verdict:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: compare installed base and candidate wheels
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/testing/ci.py --base "$BASE_REF"
      - name: retain the verdict and wheel provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crapkit-verdict
          path: .crapkit/ci-verdict
          include-hidden-files: true
          if-no-files-found: warn

  # `plugin validate` reads hooks.json and the skill frontmatter, which no Python
  # test can schema-check: a malformed handler fails here with exit 1. The two
  # calls read two different files. `validate plugin` reads
  # plugin/.claude-plugin/plugin.json; `validate .` reads the repo-root
  # .claude-plugin/marketplace.json, which is what a `claude plugin marketplace
  # add JeanFrancoisGagne/crapkit` fetches, and nothing else checks it.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: the plugin manifest, hooks and skills validate
        run: claude plugin validate plugin --strict
      - name: the marketplace manifest validates
        run: claude plugin validate .

  # The composite action at the repo root is the one surface no Python test can
  # execute: `action.yml` is read by the runner, never imported. So crapkit runs
  # it on crapkit, on every push and every pull request, and a step that breaks
  # breaks here rather than in a consumer's job. `uses: ./` takes the working
  # copy, so the action a pull request changes is the action this job runs.
  #
  # The dev extra goes in first, and with the same python the action selects:
  # the action installs crapkit and nothing else, and crapkit.toml's `py` lane
  # shells out to `pytest --cov`, which is pytest-cov's flag and pytest's
  # runner. Without them the lane writes no artifact and the comment has no run
  # to describe.
  #
  # The verdict job compares isolated wheel installations. This job exercises
  # the composite action and owns Ubuntu/Python 3.12 source tests. The explicit
  # JUnit check below rejects failures even though the action stays advisory.
  dogfood:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: the console script resolves
        run: crapkit --version
      # delta stays false, and crapkit is the repo that has to say why. The
      # delta run scores the base commit in a worktree of its own, and the `py`
      # lane there spells `--cov=crapkit`, which the action's editable install
      # of this checkout resolves to this checkout. So the base run would
      # measure HEAD's source while standing on the base commit. `crapkit
      # coverage` refuses that artifact (exit 5) and the verdict falls back, so
      # what turning it on would buy is one wasted suite run per pull request.
      - name: discard prior action test evidence
        run: python -c "from pathlib import Path; Path('.crapkit/cov/junit.xml').unlink(missing_ok=True)"
      - name: crapkit scores itself through its own action
        uses: ./
        with:
          gate: "false"
          delta: "false"
          top: "5"
          python-version: "3.12"
      - name: require the action's complete passing test suite
        run: >-
          python -c "from pathlib import Path; from crapkit.junitparse import failed_test_ids;
          raise SystemExit(bool(failed_test_ids(Path('.crapkit/cov/junit.xml').read_text(encoding='utf-8'))))"
      - name: gate changed functions against the event base
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m crapkit hook-precommit --base "$BASE_REF"
