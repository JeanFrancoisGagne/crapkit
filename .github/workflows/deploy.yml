        if: always()
        with:
          name: deploy-${{ matrix.name }}
          path: |
            .crapkit/deploy-out
            !.crapkit/deploy-out/**/in
            !.crapkit/deploy-out/**/native-*
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn

  # Native Linux cells beside the host's Docker daemon (the product image, a
  # devcontainer, podman), after toolchain.py installs the Linux pins as it
  # does for ci.yml's deploy-linux-native.
  host:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.host != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.nonblocking }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.host) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/crapkit-deploy
          key: deploy-toolchain-${{ runner.os }}-${{ matrix.harness }}-${{ hashFiles('tools/deploy/pins.toml', 'tools/deploy/wheelhouse.lock', 'tools/deploy/toolchain.py', 'tests/deploy/docker/*/package-lock.json', 'tests/deploy/docker/runner-requirements.txt') }}
      - name: install the pinned toolchain
        run: python tools/deploy/toolchain.py --harness ${{ matrix.harness }}
      - name: run the cells
        shell: python
        env:
          RUNS: ${{ toJSON(matrix.runs) }}
        run: |
          import json
          import os
          import shlex
          import subprocess
          import sys

          codes = [subprocess.run([sys.executable, "tools/deploy/run.py", *shlex.split(args),
                                   "--out", f".crapkit/deploy-out/{index}"]).returncode
                   for index, args in enumerate(json.loads(os.environ["RUNS"]))]
          print(f"run.py exit codes: {codes}")
          sys.exit(max(codes, default=0))
      - name: per-cell durations
        if: always()
        shell: python
        run: |
          import glob
          import os
          import xml.etree.ElementTree as ElementTree

          OUT = ".crapkit/deploy-out"
          rows = []
          for path in sorted(glob.glob(f"{OUT}/**/junit-*.xml", recursive=True)):
              for case in ElementTree.parse(path).iter("testcase"):
                  props = {prop.get("name"): prop.get("value") for prop in case.iter("property")}
                  kinds = {child.tag for child in case} & {"failure", "error", "skipped"}
                  verdict = "failed" if kinds & {"failure", "error"} else ("skipped" if kinds else "passed")
                  rows.append((float(case.get("time") or 0), props.get("cell_id", "kit"),
                               case.get("name", "").replace("|", "/"), verdict, os.path.relpath(path, OUT)))
          rows.sort(key=lambda row: -row[0])
          lines = [f"### Deploy cells: {len(rows)} tests, {sum(row[0] for row in rows):.0f} s", "",
                   "| seconds | cell | test | verdict | run |", "|---:|---|---|---|---|"]
          lines += [f"| {seconds:.1f} | {cell} | `{name}` | {verdict} | {run} |"
                    for seconds, cell, name, verdict, run in rows]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines if rows else ["### Deploy cells: no JUnit was written"]) + "\n")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: deploy-${{ matrix.name }}
          path: |
            .crapkit/deploy-out
            !.crapkit/deploy-out/**/in
            !.crapkit/deploy-out/**/native-*
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn

  # One command each: lock drift (a newer crapkit or lizard on PyPI than
  # wheelhouse.lock names fails; a newer harness is reported) and calibration,
  # which builds the full image.
  tool:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.tool != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.nonblocking }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.tool) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: free the runner's disk for the large images
        if: matrix.free_disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: run the command
        env:
          COMMAND: ${{ matrix.command }}
        run: bash -c "$COMMAND"

  # The README's CI job in a `container: python:3.12`, where crapkit's container
  # guard refuses the coverage lane until the documented key is set.
  gha-action-container-job:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.jobs), 'gha-action-container-job')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: python:3.12
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: crapkit
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      # The container runs as root and the runner's uid owns the workspace, so git
      # refuses the repository consumer.py makes there ("detected dubious ownership");
      # actions/checkout trusts only the crapkit/ path it checked out.
      - name: let git work in the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: build the consumer at the workspace root
        run: python crapkit/tools/deploy/consumer.py
      - id: action
        name: the action scores the consumer
        continue-on-error: true
        uses: ./crapkit
        with:
          gate: "true"
          delta: "false"
      - name: assert what the consumer sees
        if: always()
        run: python crapkit/tools/deploy/assert_action.py --cell gha-action-container-job --outcome "${{ steps.action.outcome }}"

  # A consumer pinned to the action at v0.7.6 moves its pin to the candidate;
  # the .crapkit the old action wrote stays in the workspace between the two.
  gha-action-tag-upgrade:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.jobs), 'gha-action-tag-upgrade')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: crapkit
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: check out the action as tagged v0.7.6
        run: git -C crapkit worktree add --detach ../crapkit-v0.7.6 v0.7.6
      # Seeded by 0.7.6, as the act cell seeds it: the marks carry 0.7.6's stamp
      # and crapkit.toml holds a lane command 0.7.6 can run.
      - name: build the consumer at the workspace root
        run: python crapkit/tools/deploy/consumer.py --seed-from ./crapkit-v0.7.6
      # The README's Action recipe installs what the lanes run before the Action;
      # consumer.py seeded in its own venv, so the runner's Python has no pytest.
      - name: install what the consumer's py lane runs
        run: python -m pip install pytest pytest-cov
      - id: old
        name: the action at v0.7.6 scores the consumer
        continue-on-error: true
        uses: ./crapkit-v0.7.6
        with:
          gate: "false"
          delta: "false"
      - id: action
        name: the candidate action scores it again over what v0.7.6 left
        continue-on-error: true
        uses: ./crapkit
        with:
          gate: "true"
          delta: "false"
      - name: assert what the consumer sees
        if: always()
        run: python crapkit/tools/deploy/assert_action.py --cell gha-action-tag-upgrade --outcome "${{ steps.action.outcome }}"

  gha-action-windows:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.jobs), 'gha-action-windows')
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: crapkit
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: build the consumer at the workspace root
        run: python crapkit/tools/deploy/consumer.py
      - name: install what the consumer's py lane runs
        run: python -m pip install pytest pytest-cov
      - id: action
        name: the action scores the consumer
        continue-on-error: true
        uses: ./crapkit
        with:
          gate: "true"
          delta: "false"
      - name: assert what the consumer sees
        if: always()
        run: python crapkit/tools/deploy/assert_action.py --cell gha-action-windows --outcome "${{ steps.action.outcome }}"

  # The action as GitHub serves the tag just published. `uses:` takes no
  # expression, so the job checks the tag out and runs that tree.
  published-action-tag:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.jobs), 'published-action-tag')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: crapkit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}
          path: published
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: build the consumer at the workspace root
        run: python crapkit/tools/deploy/consumer.py
      - name: install what the consumer's py lane runs
        run: python -m pip install pytest pytest-cov
      - id: action
        name: the published action scores the consumer
        continue-on-error: true
        uses: ./published
        with:
          gate: "true"
          delta: "false"
      - name: assert what the consumer sees
        if: always()
        run: python crapkit/tools/deploy/assert_action.py --cell published-action-tag --outcome "${{ steps.action.outcome }}"
