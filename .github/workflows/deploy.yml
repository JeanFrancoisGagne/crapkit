        with:
          name: deploy-${{ matrix.name }}
          path: |
            .crapkit/deploy-out
            !.crapkit/deploy-out/**/in
            !.crapkit/deploy-out/**/native-*
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn

  # Native cells on macOS.
  macos:
