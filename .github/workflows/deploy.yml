# The deploy suite's slower cadences. ci.yml runs the push set on every push
# and pull request; this workflow runs the rest:
#
#   nightly    the other harnesses, older upgrade sources, rarer channels,
#              repo shapes, version skew, act, the repeat runs and lock drift
#   weekly     macOS, arm64 on an arm64 runner, the 3.15 prerelease, the
#              cells that need the network, the harnesses at their newest
#              release, harness calibration
#   release    push, nightly and weekly together, on the tag commit:
#              `release.py run deploy` dispatches it on a scratch branch with
#              that commit's git tree id, and stage 2b wants this run green
#   published  after a version is on PyPI: the real surfaces at that version.
#              The surfaces stage dispatches it on the tag once every surface
#              reads back, at most once per release key (version, PyPI files,
#              tag commit). No tag push starts it: that run raced the upload.
#
# The scope job turns the event into one cadence and schedules the entries of
# tests/deploy/MAP.toml [jobs] whose `when` holds it. A pull request gets the
# nightly set when it changes an install surface ([scope] paths), and the
# release set when it carries the deploy-full label; any other pull request
# runs the scope job alone. Every other job reads the scope job's output.
name: deploy
# The title GitHub lists for each run: "deploy release <tree id>" for the
# release cadence `release.py run deploy` dispatches, "deploy published
# vVERSION <files digest>" for the published one. release.py finds each run at
# its commit by that name.
run-name: deploy ${{ inputs.cadence || github.event_name }} ${{ inputs.tree || inputs.ref }}${{ inputs.files && ' ' || '' }}${{ inputs.files }}
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      cadence:
        description: which set to run
        type: choice
        options: [nightly, weekly, release, published]
        default: nightly
      ref:
        description: the commit or tag to test (default, the ref this run was dispatched on)
        type: string
        default: ""
      tree:
        description: the git tree id of the commit under test (git rev-parse vVERSION^{tree}); the scope job fails when the checkout's tree differs
        type: string
        default: ""
      files:
        description: the published cadence's key, sha256 over the PyPI files of the version under test; it only names the run
        type: string
        default: ""

permissions:
  contents: read

# A newer push to a pull request cancels the run it replaces. Adding a label
# other than deploy-full starts a run of its own group, so it never cancels a
# run in progress.
concurrency:
  group: deploy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || github.event.schedule || inputs.cadence || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cadence: ${{ steps.plan.outputs.cadence }}
      jobs: ${{ steps.plan.outputs.jobs }}
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      macos: ${{ steps.plan.outputs.macos }}
      arm: ${{ steps.plan.outputs.arm }}
      host: ${{ steps.plan.outputs.host }}
      tool: ${{ steps.plan.outputs.tool }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # The release's deploy record is keyed on the tag commit's git tree id:
      # the run tests the tree release.py named, or no cell runs. A tree id
      # names committed content, so the Windows release checkout (CRLF on disk)
      # and this LF checkout read one key; a hash of working-tree bytes did not.
      - name: match the checkout's git tree id with the release's
        if: inputs.tree != ''
        env:
          TREE: ${{ inputs.tree }}
        run: |
          found="$(git rev-parse 'HEAD^{tree}')"
          if [ "$found" != "$TREE" ]; then
            echo "deploy scope: the checkout's tree is $found, and the release dispatched this run for $TREE" >&2
            exit 1
          fi
      - id: plan
        name: choose the cadence and the jobs it runs
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCHEDULE: ${{ github.event.schedule }}
          CADENCE_INPUT: ${{ inputs.cadence }}
        run: |
          import json
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          MAP = tomllib.loads(Path("tests/deploy/MAP.toml").read_text(encoding="utf-8"))
          SCOPE, JOBS = MAP["scope"], MAP["jobs"]
          RUNNERS = ("linux", "arm", "windows", "macos", "host", "tool", "action")


          def surface_changes():
              diff = ["git", "-c", "core.quotepath=off", "diff", "--name-only", "-z", os.environ["BASE_SHA"] + "...HEAD"]
              names = subprocess.run(diff, capture_output=True, text=True, check=True).stdout.split("\0")
              return [name for name in names if name and name.startswith(tuple(SCOPE["paths"]))]


          def labels():
              return json.loads(os.environ.get("LABELS") or "null") or []


          def labeled(label):
              """A labeled event counts only when the label added is this one."""
              return ("release", "labeled " + label) if os.environ.get("LABEL") == label else ("none", "another label")


          def pull_request():
              label = SCOPE["label"]
              if os.environ.get("ACTION") == "labeled":
                  return labeled(label)
              if label in labels():
                  return "release", "labeled " + label
              changed = surface_changes()
              return ("nightly", "changes " + ", ".join(changed[:5])) if changed else ("none", "no install surface changed")


          def cadence():
              event = os.environ["EVENT_NAME"]
              if event == "pull_request":
                  return pull_request()
              if event == "schedule":
                  return SCOPE["schedules"][os.environ["SCHEDULE"]], "schedule " + os.environ["SCHEDULE"]
              return os.environ["CADENCE_INPUT"], "dispatched"


          def entry(name, job, chosen):
              return {"name": name, "timeout": job["timeout"], "nonblocking": job.get("nonblocking", False),
                      "free_disk": job.get("free_disk", False), "harness": job.get("harness", "none"),
                      "then": job.get("then", ""), "command": job.get("command", ""),
                      "runs": [args.replace("{cadence}", chosen) for args in job.get("runs", [])]}


          def plan(chosen):
              matrices = {runner: [] for runner in RUNNERS}
              for name, job in JOBS.items():
                  if chosen in job["when"] and not job.get("blocked"):
                      matrices[job["runner"]].append(entry(name, job, chosen))
              return matrices


          chosen, why = cadence()
          matrices = plan(chosen)
          names = [item["name"] for items in matrices.values() for item in items]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"cadence={chosen}\njobs={json.dumps(names)}\n")
              out.writelines(f"{runner}={json.dumps(items)}\n" for runner, items in matrices.items())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"deploy scope: {chosen} ({why}); jobs: {', '.join(names) or 'none'}\n")

  # Container cells: each entry builds or reuses its image and runs run.py.
  linux:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.linux != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.nonblocking }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.linux) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: free the runner's disk for the large images
        if: matrix.free_disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: pull Docker Hub images through mirror.gcr.io
        run: |
          conf=/etc/docker/daemon.json
          { sudo cat "$conf" 2>/dev/null || echo '{}'; } | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' > /tmp/daemon.json
          sudo mv /tmp/daemon.json "$conf"
          sudo systemctl restart docker
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          version: v0.37.1
          name: crapkit-deploy
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487  # v4.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: run the cells
        shell: python
        env:
          RUNS: ${{ toJSON(matrix.runs) }}
        run: |
          import json
          import os
          import shlex
          import subprocess
          import sys

          codes = [subprocess.run([sys.executable, "tools/deploy/run.py", *shlex.split(args),
                                   "--out", f".crapkit/deploy-out/{index}"]).returncode
                   for index, args in enumerate(json.loads(os.environ["RUNS"]))]
          print(f"run.py exit codes: {codes}")
          sys.exit(max(codes, default=0))
      - name: then
        if: matrix.then != ''
        env:
          THEN: ${{ matrix.then }}
        run: bash -c "$THEN"
      - name: per-cell durations
        if: always()
        shell: python
        run: |
          import glob
          import os
          import xml.etree.ElementTree as ElementTree

          OUT = ".crapkit/deploy-out"
          rows = []
          for path in sorted(glob.glob(f"{OUT}/**/junit-*.xml", recursive=True)):
              for case in ElementTree.parse(path).iter("testcase"):
                  props = {prop.get("name"): prop.get("value") for prop in case.iter("property")}
                  kinds = {child.tag for child in case} & {"failure", "error", "skipped"}
                  verdict = "failed" if kinds & {"failure", "error"} else ("skipped" if kinds else "passed")
                  rows.append((float(case.get("time") or 0), props.get("cell_id", "kit"),
                               case.get("name", "").replace("|", "/"), verdict, os.path.relpath(path, OUT)))
          rows.sort(key=lambda row: -row[0])
          lines = [f"### Deploy cells: {len(rows)} tests, {sum(row[0] for row in rows):.0f} s", "",
                   "| seconds | cell | test | verdict | run |", "|---:|---|---|---|---|"]
          lines += [f"| {seconds:.1f} | {cell} | `{name}` | {verdict} | {run} |"
                    for seconds, cell, name, verdict, run in rows]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines if rows else ["### Deploy cells: no JUnit was written"]) + "\n")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: deploy-${{ matrix.name }}
          path: |
            .crapkit/deploy-out
            !.crapkit/deploy-out/**/in
            !.crapkit/deploy-out/**/native-*
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn

  # Container cells on the arm64 runner: the linux job's steps, with images
  # built for linux/arm64 natively instead of under emulation.
  arm:
