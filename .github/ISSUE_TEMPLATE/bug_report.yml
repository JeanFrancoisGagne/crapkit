name: Bug report
description: crapkit crashed, refused a run, or scored something wrong.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: crapkit --version
      description: Paste the whole line.
      placeholder: the output of crapkit --version, unedited
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What you ran, and what you expected
      description: The exact command line first. Then one line on what should have come back.
      placeholder: |
        crapkit coverage
        Expected a scored run. Got exit 5 and no artifact.
    validations:
      required: true

  - type: textarea
    id: lane
    attributes:
      label: Your crapkit.toml, lane and scope blocks only
      description: >
        Remove secrets from command arguments and environment values before posting.
        Keep the lane and scope structure, including artifact paths.
      render: toml
      placeholder: |
        [[scope]]
        name = "src"
        paths = ["src"]
        languages = ["python"]

        [[lane]]
        name = "py"
        command = "python -m pytest --cov --cov-branch --cov-report=json:.crapkit/cov/py.json --junitxml=.crapkit/cov/junit-py.xml"
        artifact = ".crapkit/cov/py.json"
        results_artifact = ".crapkit/cov/junit-py.xml"
        parser = "coveragepy"
        scopes = ["src"]
    validations:
      required: true

  - type: textarea
    id: stderr
    attributes:
      label: The exact stderr
      description: >
        Include the output and exit code. Exact error text helps locate the
        failing branch; remove secrets before posting.
      render: shell
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: crapkit doctor
      description: >
        Paste the report. It checks configuration, executable resolution and
        missing result artifacts. It does not run the full test suite.
      render: shell
    validations:
      required: true

  - type: textarea
    id: plugin
    attributes:
      label: crapkit doctor --plugin-root
      description: >
        Only for a bug in the Claude Code plugin: the advisory hook, the MCP
        server, or an installed plugin that disagrees with the CLI. With no
        path it reads Claude Code's plugin directory and prints the root it
        picked (`crapkit doctor: checking <path>`), then one line per
        disagreement. It prints nothing else when the two agree, and that
        silence is worth pasting too. Give it a path to check a plugin
        somewhere else: the plugin root or any directory above it.
      render: shell
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: OS, Python, and how crapkit is installed
      description: >
        The install matters as much as the version. crapkit reads a lane
        command with the shell that will run it, cmd.exe on Windows and sh
        everywhere else, so the same command can pass on one and be refused on
        the other. And a pipx or uv-tool install puts crapkit beside a python
        that is not the one running your suite.
      placeholder: Windows 11, Python 3.12.4, pip install -e in the project venv
    validations:
      required: true
