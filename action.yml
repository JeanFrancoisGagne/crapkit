name: crapkit complexity gate
description: Score the checkout with crapkit and comment the worklist and the verdict on the pull request.
author: Jean-Francois Gagne

branding:
  icon: bar-chart-2
  color: red

inputs:
  gate:
    description: >-
      "true" exits with crapkit verify's own code, so a finding fails the check.
      Anything else exits 0 and the comment is the whole output.
    required: false
    default: "false"
  delta:
    description: >-
      "true", the default, scores the pull request's base commit first so the
      verdict covers the commits the pull request adds. It costs a second lane
      run. Anything else, and on a push event, scores the checkout alone.
    required: false
    default: "true"
  top:
    description: worklist rows to render for the changed files.
    required: false
    default: "5"
  python-version:
    description: the python actions/setup-python installs crapkit into.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # GITHUB_ACTION_PATH is this action's own checkout, which is the ref the
    # consumer pinned in `uses:`. Installing from it is what makes
    # `crapkit@v0.4.8` mean the 0.4.8 code: `pip install crapkit` here would
    # score every consumer with whatever released last, whatever they pinned.
    # Editable, because a regular install replaces an editable one of the same
    # package that the consumer's own setup step made, and when that consumer
    # is crapkit itself (`uses: ./`) the lane's `--cov=crapkit` then measures the
    # copy in site-packages: 61 files outside the checkout, and the wrong-tree
    # refusal failed the lane on the first run of this action.
    - name: install crapkit from this action's own checkout
      shell: bash
      run: pip install -e "$GITHUB_ACTION_PATH"

    # Every step below keeps its own status at 0 and records what it got. The
    # comment is this action's output, and a job that dies at step three posts
    # nothing and explains nothing.

    # verify measures the diff from its baseline run's commit, and a fresh CI
    # checkout holds no run at all. This step makes the one the verdict wants:
    # a detached worktree at the fork point, the lanes run there, and that store
    # copied over the checkout's, so the step below has a run at the fork point
    # to pick as its baseline. The price is a second lane run on every pull
    # request; `delta: "false"` buys it back.
    #
    # merge-base, not base.sha itself: base.sha is the base branch's tip when
    # the event fired, and a base branch that moved after the fork puts commits
    # in it that HEAD never saw. verify would then look for a run at or behind
    # the real fork, find none, and refuse.
    #
    # Every failure here is the same failure: no base run. A shallow clone
    # without the fork point, a fork point that predates crapkit.toml, a lane
    # that will not run against that tree. None of them stops the job, and the
    # verdict below falls back to judging the checkout against its own run.
    - name: score the base commit
      if: ${{ github.event_name == 'pull_request' && inputs.delta == 'true' }}
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        code=0
        base="$RUNNER_TEMP/crapkit-base"
        rm -rf "$base"
        git worktree prune
        fork="$(git merge-base "$BASE_SHA" HEAD)" || code=$?
        if [ "$code" = 0 ]; then
          git worktree add --detach "$base" "$fork" || code=$?
        fi
        if [ "$code" = 0 ]; then
          crapkit coverage --repo "$base" --json > "$RUNNER_TEMP/crapkit-base.json" || code=$?
        fi
        if [ "$code" = 0 ]; then
          mkdir -p .crapkit
          cp "$base/.crapkit/crap.sqlite" .crapkit/crap.sqlite || code=$?
        fi
        if [ "$code" = 0 ]; then
          echo "$fork" > "$RUNNER_TEMP/crapkit-base.sha"
        fi
        echo "crapkit base scoring exited $code"

    - name: score the checkout
      shell: bash
      run: |
        code=0
        crapkit coverage --json > "$RUNNER_TEMP/crapkit-coverage.json" || code=$?
        echo "crapkit coverage exited $code"

    # --reuse-artifacts parses the lane artifacts the step above just wrote from
    # this same tree, instead of running the whole suite a second time for the
    # same numbers.
    #
    # `--base SHA` moves the diff basis to merge-base(SHA, HEAD) and takes the
    # newest trusted run at or behind that fork as the baseline, which is the
    # run the base step wrote. So the gate judges the functions the pull request
    # changed. Without that run the basis is the checkout's own run and the diff
    # is empty, which reports the tree's own health and judges no function.
    - name: the verdict
      shell: bash
      run: |
        code=0
        sha="$RUNNER_TEMP/crapkit-base.sha"
        out="$RUNNER_TEMP/crapkit-verify.json"
        if [ -s "$sha" ]; then
          echo "the verdict covers the diff from $(cat "$sha")"
          crapkit verify --json --reuse-artifacts --base "$(cat "$sha")" > "$out" || code=$?
        else
          echo "no run at the fork point: the verdict covers this checkout alone"
          crapkit verify --json --reuse-artifacts > "$out" || code=$?
        fi
        echo "$code" > "$RUNNER_TEMP/crapkit-verify.exit"
        echo "crapkit verify exited $code"

    - name: the ranked worklist
      shell: bash
      run: |
        code=0
        crapkit worklist --json > "$RUNNER_TEMP/crapkit-worklist.json" || code=$?
        echo "crapkit worklist exited $code"

    # The rows a reviewer can act on are the ones in the diff in front of them.
    # Three dots, so the list is what the branch added since the fork rather
    # than every difference between two tips: a base branch that moved would
    # otherwise put its own commits in the pull request's table. base.sha is
    # empty on a push, and a shallow clone does not hold the commit it names;
    # either way the list is empty and the comment ranks the whole repository
    # instead of a slice of it.
    - name: the changed files
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        changed="$RUNNER_TEMP/crapkit-changed.txt"
        : > "$changed"
        if [ -n "$BASE_SHA" ]; then
          git diff --name-only "$BASE_SHA...HEAD" > "$changed" || : > "$changed"
        fi
        echo "$(wc -l < "$changed") changed file(s)"

    - name: build the comment
      shell: bash
      env:
        TOP: ${{ inputs.top }}
      run: |
        python "$GITHUB_ACTION_PATH/tools/action/comment.py" \
          --coverage "$RUNNER_TEMP/crapkit-coverage.json" \
          --verify "$RUNNER_TEMP/crapkit-verify.json" \
          --verify-exit "$(cat "$RUNNER_TEMP/crapkit-verify.exit")" \
          --worklist "$RUNNER_TEMP/crapkit-worklist.json" \
          --changed "$RUNNER_TEMP/crapkit-changed.txt" \
          --top "$TOP" \
          --out "$RUNNER_TEMP/crapkit-comment.md" \
          --json-out "$RUNNER_TEMP/crapkit-comment.json"
        cat "$RUNNER_TEMP/crapkit-comment.md"

    # One comment, edited in place. The marker line the builder writes is what
    # finds it, so a fifteen-push branch carries one comment and not fifteen.
    # A push event has no pull request to carry one: the text is in the log
    # above and nothing is posted.
    #
    # A pull request from a fork carries a read-only token, so both writes come
    # back 403. That is the consumer's permissions, not a finding, and the
    # comment is only ever this action's output: the step records the status the
    # way every step above does and the gate below still decides the job.
    - name: post the comment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        code=0
        if [ -z "$PR" ]; then
          echo "no pull request on this event: the comment above was not posted"
          exit 0
        fi
        id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq 'map(select(.body | contains("<!-- crapkit-action -->"))) | .[0].id // empty' \
              | head -n 1)" || code=$?
        if [ -n "$id" ]; then
          gh api --silent --method PATCH "repos/$REPO/issues/comments/$id" \
            --input "$RUNNER_TEMP/crapkit-comment.json" || code=$?
        else
          gh api --silent --method POST "repos/$REPO/issues/$PR/comments" \
            --input "$RUNNER_TEMP/crapkit-comment.json" || code=$?
        fi
        why=""
        if [ "$code" != 0 ]; then
          why=": a fork pull request's token cannot write comments, and the verdict is in this job's log"
        fi
        echo "posting the crapkit comment exited $code$why"

    # `gate: true` is the only thing that can fail this action. Adoption starts
    # advisory: the comment lands, the check stays green, and the team turns the
    # gate on when it has decided which findings should stop a merge.
    - name: the exit code
      shell: bash
      env:
        GATE: ${{ inputs.gate }}
      run: |
        code="$(cat "$RUNNER_TEMP/crapkit-verify.exit")"
        if [ "$GATE" = "true" ]; then
          echo "gate is on: exiting with verify's code $code"
          exit "$code"
        fi
        echo "gate is off: verify's code $code is in the comment, this check stays green"
