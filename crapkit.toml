[crapkit]
target = 6
notes = [
  "Run tests/unit with -n 4 and tests/e2e with -n 8. Use tools/testing/run.py --unit-workers 1 for a serial unit reproduction. Both suites run before a change is done.",
  "Every function crapkit ships stays at ccn <= 6. The ceiling is not a number to argue with: decompose the function, never raise it.",
]
# `crapkit mutate` on this repo: the suite run once per mutant is tests/unit plus
# every accuracy test that spawns nothing and compares crapkit with no copy of
# itself (golden, change-control and cross-surface tests are left out). The
# killer puts the mutation worktree's src/ first on PYTHONPATH, because an
# editable install points at the main checkout and would test unmutated code.
# The deadline is three times the killer's measured clean run.
mutation_command = "python tools/accuracy/mutation.py killer"
mutation_timeout_seconds = 1800
mutation_workers = 1

# One command per scope. No {files} placeholder on purpose: the tests live in
# tests/, which no scope owns, so substituting a source path would hand pytest a
# collection target holding no tests (exit 5).
[crapkit.scoped_tests]
src = "python -m pytest tests/unit -p no:randomly -n 4 --dist worksteal"

[[scope]]
name = "src"
paths = ["src"]
languages = ["python"]
notes = [
  "Register a new subcommand once in the parser. Import helpers from their owning CLI family; crapkit.cli exports only the lazy main entry point.",
]

# --cov=crapkit (module name, not path): the e2e tests run the CLI in tmp repos,
# so whatever carries the source into the child has to resolve from the CHILD's
# cwd. A path-based source measured nothing there and cli.py read a false 0%.
# What carries it is pyproject.toml's [tool.coverage.run] patch = ["subprocess"]
# (coverage >= 7.10.6), not pytest-cov: 7.0.0 dropped its own COV_CORE_SOURCE
# hook, and without the patch key every cmd_* in cli/ reads 0% on pytest-cov 7.
[[scope]]
name = "tools"
paths = ["tools"]
languages = ["python"]
# The comment builder the Action runs, the demo generator and the pytest-cov
# reproduction. Nothing under here has a lane: coverage_optional keeps the ccn
# ceiling on them and asks for nothing else. The demo's sample repo and its
# history are excluded above; they are the subject of the demo, not crapkit.
coverage_optional = true

# The calculation-accuracy tools: the tier runner, change control, the retro
# replay, the mutation gate and the wheel diff. They decide whether a number
# crapkit prints is right, so they sit one under the product's ceiling. Their
# tests are tests/accuracy, which the py lane does not run; mutation floors
# (tests/accuracy/suite_strength/mutation/floors.tsv) measure them instead.
[[scope]]
name = "accuracy"
paths = ["tools/accuracy"]
languages = ["python"]
target = 5
coverage_optional = true

[[lane]]
name = "py"
command = "python tools/testing/run.py --coverage --output .crapkit/cov"
artifact = ".crapkit/cov/py.json"
parser = "coveragepy"
scopes = ["src"]
results_artifact = ".crapkit/cov/junit.xml"

[exclude]
globs = ["tests/**", "tools/demo/fixture/**", "tools/demo/history/**"]
