# --- harness CLIs ----------------------------------------------------------
# `npm` harnesses are locked in tests/deploy/docker/harness-<image>/; the test
# holds each package.json dependency to the version here. `floors` are the
# oldest versions a cell runs, installed beside the pinned one under an npm
# alias named "<key>-<version>".

[harness.claude-code]
npm = "@anthropic-ai/claude-code"
version = "2.1.281"
floors = ["2.1.139", "2.1.138"]
image = "core"
command = "claude"

[harness.codex]
npm = "@openai/codex"
version = "0.156.1"
# 0.121.0 added `codex marketplace add` (release notes, #17087).
floors = ["0.121.0"]
image = "core"
command = "codex"

[harness.cursor-agent]
version = "2026.09.23-86fc751"
binary = "cursor-agent"
image = "core"
command = "cursor-agent"
# Cursor's installers add `agent`, the name its docs use, beside cursor-agent.
aliases = ["agent"]

[harness.gemini-cli]
npm = "@google/gemini-cli"
version = "0.61.0"
image = "full"
command = "gemini"

[harness.opencode]
