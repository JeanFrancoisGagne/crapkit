# Every version and hash the deploy suite installs.
#
# tools/deploy/run.py turns this file into the Dockerfile's build args, and
# tools/deploy/toolchain.py installs the same pins natively on Windows, macOS
# and the bare Linux runner. Nothing else feeds either one. tests/unit/test_deploy_pins.py holds
# the Dockerfile, both harness package.json files and the npm fixtures to it.
#
# Change a pin here, then run `python tools/deploy/lock.py` to refresh
# wheelhouse.lock, and rebuild with `python tools/deploy/run.py --build-only`.

[images]
# The Dockerfile's `# syntax=` line spells this one literally; the test compares.
syntax = "docker/dockerfile:1.7@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e"
debian = "debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a"
uv = "ghcr.io/astral-sh/uv:0.12.18@sha256:3adc3706091ce7c2fe595e669628caedd6d951551b92b258b7e7dbe06d9440bc"
node = "node:22.23.3-trixie-slim@sha256:b26b04c123d9ff8ab646ceb18b9d75a1173acf64b9a401094b906d27b29338d4"
buildkit = "moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3"
buildx = "v0.37.1"
# apt reads snapshot.debian.org at this instant, so a rebuild months later
# installs the same packages.
snapshot = "20260923T000000Z"
platform = "linux/amd64"
# The root Dockerfile's documented base floats on purpose: the product image
# is built as a user builds it. run.py records the digest it resolved.
product_base = "python:3.12-slim"

[python]
# Every CPython crapkit supports, installed by uv from python-build-standalone.
versions = ["3.11.16", "3.12.14", "3.13.15", "3.14.7"]
# Below requires-python: the version lin-pip-old-python refuses.
old = "3.10.21"
# The next CPython's prerelease, in every image for the weekly lin-py315-start
# job (non-blocking); the native toolchains leave it out.
prerelease = "3.15.0rc2"
# The runner venv that drives pytest; never on a sandbox PATH.
runner = "3.12.14"

[toolchain]
uv = "0.12.18"
node = "22.23.3"
# Debian trixie's git; native runs use PortableGit below.
git_linux = "2.47"
portable_git = "2.55.0.windows.5"
pwsh = "7.6.6"
pipx = "1.17.6"
prek = "0.5.3"
act = "0.2.89"
bun = "1.4.2"

[runners]
linux = "ubuntu-24.04"
windows = "windows-2025"
macos = "macos-15"
arm = "ubuntu-24.04-arm"

[actions]
checkout = "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
setup_python = "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"  # v7.0.0
setup_buildx = "docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069"  # v4.4.1
github_runtime = "crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487"  # v4.0.0
upload_artifact = "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
cache = "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9"  # v6.1.0

[wheelhouse]
# Old releases the upgrade cells start from. The newest release on PyPI (N-1
# to the candidate) is added by lock.py and named in wheelhouse.lock, never here.
crapkit = ["0.4.0", "0.4.2", "0.4.4", "0.4.5", "0.4.15", "0.5.1", "0.6.0", "0.7.6"]
lizard = "1.24.0"
# One resolution per set, so conflicting pins (three pytest-cov majors, two
# coverage lines) each land their own files.
sets = [
    ["pip", "setuptools", "wheel", "build", "virtualenv"],
    ["pre-commit"],
    ["prek"],
    ["poetry"],
    ["pdm"],
    ["pipenv"],
    ["pytest", "pytest-xdist", "PyYAML", "Pillow"],
    ["pytest-cov>=5,<6", "coverage>=7.10.6"],
    ["pytest-cov>=6,<7", "coverage>=7.10.6"],
    ["pytest-cov>=7,<8", "coverage>=7.10.6"],
    ["coverage==7.4.*", "pytest-cov>=5,<6"],
    # pytest needs colorama on Windows only, so no Linux or macOS resolution
    # fetches it; a universal lock (uv lock, poetry lock, pdm lock) still
    # names it and fails offline without it.
    ["colorama"],
    # The README's pipx route, installed the way a user installs pipx.
    ["pipx"],
]

# One row per interpreter and platform a job installs on: every supported
# CPython on Linux x86_64 (the images), Linux aarch64 (lin-arm64), Windows and
# macOS (toolchain.py), plus the prerelease on Linux x86_64 for lin-py315-start.
