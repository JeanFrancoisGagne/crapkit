# --- the weekly latest-harnesses job --------------------------------------------
# `run.py --image full-latest` installs every harness at its newest release over
# the full image: each [harness] npm and pip package at @latest, the Cursor agent
# through Cursor's own installer and Goose from its latest release. These are
# the sources it reads, not pins; the job exists to meet releases no pin names.

[latest]
cursor_install = "https://cursor.com/install"
goose = "https://github.com/aaif-goose/goose/releases/latest/download/goose-x86_64-unknown-linux-gnu.tar.bz2"
