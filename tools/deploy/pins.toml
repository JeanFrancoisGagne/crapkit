[harness.crush]
npm = "@charmland/crush"
version = "0.96.1"
image = "full"
command = "crush"
# Its postinstall fetches the release archive and checks this sha256 itself
# (package.json "archives"); the lock pins that package.json.
payload_sha256 = "5411b0906a82162dcab4a99071d70accf1caad0eee69789416dd607943c6680d"

[harness.claude-agent-sdk]
npm = "@anthropic-ai/claude-agent-sdk"
version = "0.3.281"
image = "full"

[harness.amp]
npm = "@ampcode/cli"
version = "0.0.1790265644-gf7438f"
image = "full"
command = "amp"

[harness.junie]
npm = "@jetbrains/junie-cli"
version = "1468.30.0"
# The release the npm package installs, as `junie --version` prints it.
