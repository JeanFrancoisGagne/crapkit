# Every outside tool the accuracy suite reads an expected value from, pinned.
#
# An oracle is the expected value. A new release of one moves expectations the
# way a crapkit change moves results, so each is pinned here and nowhere else:
#
#   kind      python   imported from the hashed lock in tools/accuracy/requirements-*.txt
#             node     installed by npm ci from tools/accuracy/node/<tier>/package-lock.json
#             producer a coverage or test runner whose recorded artifacts a packet replays;
#                      it runs only when a recording is regenerated
#             binary   installed into the accuracy image by tools/accuracy/image/install-tools.sh
#   tier      push or nightly: which lock or node directory holds it
#   url       the exact artifact installed (the sdist for Python, the npm tarball, the
#             linux/amd64 release asset for a binary)
#   sha256    that artifact's digest; install-tools.sh refuses a download that differs
#   command   how kit.oracles asks a binary its version; {bin} is the resolved path
#   version_line  what the version answer must contain. A binary pinned by `check =
#             "sha256"` has no version flag worth reading, so its installed file at
#             `path` must hash to sha256 instead.
#
# kit.oracles reads this file. In the nightly and release tiers a difference
# between the installed tool and its pin fails the test that asked for it:
# "oracle radon is 6.0.2, pins.toml says 6.0.1".

[snapshot]
# apt in the image reads snapshot.debian.org at this instant, so a rebuild with
# unchanged pins installs the same packages. The base is trixie because two
# pinned binaries need a newer C library than bookworm's glibc 2.36:
# cargo-crap 0.5.0 needs glibc 2.39, SwiftLint 0.65.1 glibc 2.38.
debian = "20260920T000000Z"
base = "debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a"
python_build_standalone = "20260901"

