[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crapkit"
version = "0.4.1"
description = "Scores every function on complexity times uncovered risk, ranks the worst, and blocks commits that add more."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [{ name = "Jean-Francois Gagne" }]
keywords = [
    "complexity",
    "coverage",
    "crap",
    "code-quality",
    "technical-debt",
    "cyclomatic",
    "ratchet",
    "pre-commit",
    "claude-code",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
# lizard 1.24.0 is the PyPI release cut from the exact commit crapkit was built
# against (tag 1.24.0 == 308b1c3e); earlier releases lack the TSX handling.
dependencies = [
    "lizard>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/JeanFrancoisGagne/crapkit"
Documentation = "https://jeanfrancoisgagne.github.io/crapkit/handbook.html"
Changelog = "https://github.com/JeanFrancoisGagne/crapkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/JeanFrancoisGagne/crapkit/issues"
Source = "https://github.com/JeanFrancoisGagne/crapkit"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
crapkit = "crapkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -p no:cacheprovider"
