[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crapkit"
version = "0.3.0"
description = "Deterministic CRAP-score framework: per-function complexity x coverage risk, worklists, ratchets, refactor verification"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jean-Francois Gagne" }]
keywords = ["crap", "code-quality", "complexity", "coverage", "ratchet", "technical-debt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
# lizard 1.24.0 is the PyPI release cut from the exact commit crapkit was built
# against (tag 1.24.0 == 308b1c3e); earlier releases lack the TSX handling.
dependencies = [
    "lizard>=1.24.0",
]

[project.urls]
Repository = "https://github.com/JeanFrancoisGagne/crapkit"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
crapkit = "crapkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -p no:cacheprovider"
