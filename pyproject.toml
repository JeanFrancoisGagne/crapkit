[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crapkit"
version = "0.4.4"
description = "Scores every function on complexity times uncovered risk, ranks the worst, and blocks commits that add more."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [{ name = "Jean-Francois Gagne" }]
keywords = [
    "complexity",
    "coverage",
    "crap",
    "code-quality",
    "technical-debt",
    "cyclomatic",
    "ratchet",
    "pre-commit",
    "claude-code",
    "mcp",
    "mutation-testing",
    "static-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    # Scoring reads git: the churn walk, the staged blobs the gate reads, and
    # the worker worktrees mutate adds.
    "Topic :: Software Development :: Version Control :: Git",
]
requires-python = ">=3.11"
# lizard 1.24.0 is the PyPI release cut from the exact commit crapkit was built
# against (tag 1.24.0 == 308b1c3e); earlier releases lack the TSX handling.
dependencies = [
    "lizard>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/JeanFrancoisGagne/crapkit"
Documentation = "https://jeanfrancoisgagne.github.io/crapkit/handbook.html"
Changelog = "https://github.com/JeanFrancoisGagne/crapkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/JeanFrancoisGagne/crapkit/issues"
Source = "https://github.com/JeanFrancoisGagne/crapkit"

[project.optional-dependencies]
# pytest-xdist is not a convenience, and two things need it. tests/fixtures/
# mini_repo declares a lane that shells out to `pytest pylib -n 2 ...`, and
# pytest rejects `-n` outright without it: left out of this list it took down
# 31 e2e tests on every one of the six CI test jobs (run 33225190806), ubuntu
# and windows alike. CI then runs tests/e2e itself with `-n 8`: 593 tests,
# 8m08 serial against about 2 minutes parallel on the same tree. Nothing here
# needs pytest-timeout: no test takes a `--timeout` and none carries the marker.
dev = ["pytest>=8", "pytest-cov>=5", "pytest-xdist>=3"]
# The py lane's runtime half, for installs that share the suite's venv: the
# lane init writes runs `pytest --cov`, and those flags come from pytest-cov.
# An install elsewhere (pipx, uv tool) still needs pytest-cov beside the SUITE;
# init probes the python that runs pytest, not its own, and names
# `pip install "crapkit[py]"` when those are the same environment. Double
# quotes: single ones do not survive cmd.exe.
py = ["pytest-cov>=5"]

[project.scripts]
crapkit = "crapkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# No `-n` here on purpose. tests/unit runs serially so every failure reproduces
# in place, and xdist would hide which test wrote the file the next one read.
# CI passes `-n 8` on the tests/e2e command line, where the work is subprocesses
# in throwaway git repos and the workers cannot see each other.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -p no:cacheprovider"
