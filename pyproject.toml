[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crapkit"
version = "0.8.0"
description = "Scores every function on complexity times uncovered risk, ranks the worst, and blocks commits that add more."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [{ name = "Jean-Francois Gagne" }]
keywords = [
    "complexity",
    "coverage",
    "crap",
    "code-quality",
    "technical-debt",
    "cyclomatic",
    "ratchet",
    "pre-commit",
    "claude-code",
    "mcp",
    "mutation-testing",
    "static-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    # Scoring reads git: the churn walk, the staged blobs the gate reads, and
    # the worker worktrees mutate adds.
    "Topic :: Software Development :: Version Control :: Git",
]
requires-python = ">=3.11"
# lizard 1.24.0 is the PyPI release cut from the exact commit crapkit was built
# against (tag 1.24.0 == 308b1c3e); earlier releases lack the TSX handling.
# The cap keeps a new lizard from moving a score unannounced: its readers decide
# every ccn crapkit stores. Lifting it needs a row in
# tests/accuracy/change_control/CHANGES.tsv, and the nightly lizard-edge job
# scores the small corpus under the newest lizard so the move is known first.
dependencies = [
    "lizard>=1.24.0,<1.25",
]

[project.urls]
Homepage = "https://github.com/JeanFrancoisGagne/crapkit"
Documentation = "https://www.jfgagne.com/crapkit/handbook.html"
Changelog = "https://github.com/JeanFrancoisGagne/crapkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/JeanFrancoisGagne/crapkit/issues"
Source = "https://github.com/JeanFrancoisGagne/crapkit"

[project.optional-dependencies]
# pytest-xdist is not a convenience, and two things need it. tests/fixtures/
# mini_repo declares a lane that shells out to `pytest pylib -n 2 ...`, and
# pytest rejects `-n` outright without it: left out of this list it took down
# 31 e2e tests on every one of the six CI test jobs (run 33225190806), ubuntu
# and windows alike. CI then runs tests/e2e itself with `-n 8`: 595 tests,
# about 8 minutes serial against about 1m30 parallel on the same tree. Nothing
# here needs pytest-timeout: no test takes a `--timeout` and none carries the
# marker.
# xdist 3.7 supports Python 3.13 and atomic reassignment for work stealing.
dev = ["pytest>=8", "pytest-cov>=5", "pytest-xdist>=3.7", "coverage>=7.10.6", "PyYAML>=6", "Pillow"]
# coverage>=7.10.6 in both extras is the floor `[tool.coverage.run] patch` needs,
# and it is not decoration: coverage 7.9 answers an unrecognized `[run] patch=`
# with a CoverageWarning that pytest-cov 6.2.0 and later file under
# `once::CoverageWarning`, so an older coverage takes the key, says so once in a
# warnings block nobody reads, and measures no subprocess at all.
# The py lane's runtime half, for installs that share the suite's venv: the
# lane init writes runs `pytest --cov`, and those flags come from pytest-cov.
# An install elsewhere (pipx, uv tool) still needs pytest-cov beside the SUITE;
# init probes the python that runs pytest, not its own, and names
# `pip install "crapkit[py]"` when those are the same environment. Double
# quotes: single ones do not survive cmd.exe.
py = ["pytest-cov>=5", "coverage>=7.10.6"]
# The calculation-accuracy suite (tests/accuracy, tools/accuracy). Every oracle
# is pinned exactly: an oracle is the expected value, and a new release of one
# moves expectations the way a crapkit change moves results. The hashed lock
# files in tools/accuracy are what CI installs; these lists are their source.
# accuracy-push is what every push runs; accuracy adds the nightly oracles.
accuracy-push = [
    "hypothesis==6.168.1",
    "radon==6.0.1",
    "mccabe==0.7.0",
    "complexipy==8.0.1",
    "coverage==7.16.1",
    "unidiff==1.0.1",
    "junitparser==5.0.3",
    "numpy==2.4.6",
    "filelock==4.0.3",
    "html5lib==1.1",
    "jsonschema==4.26.0",
    "rfc3986==2.0.0",
]
accuracy = [
    "hypothesis==6.168.1",
    "radon==6.0.1",
    "mccabe==0.7.0",
    "complexipy==8.0.1",
    "coverage==7.16.1",
    "unidiff==1.0.1",
    "junitparser==5.0.3",
    "numpy==2.4.6",
    "filelock==4.0.3",
    "html5lib==1.1",
    "jsonschema==4.26.0",
    "rfc3986==2.0.0",
    "pylint==4.0.9",
    "pydriller==2.12",
    "pygit2==1.20.1",
    "networkx==3.6.1",
    "mlxtend==0.25.0",
    "slipcover==1.1.0",
    "diff-cover==10.6.0",
    "pytest-reportlog==1.0.0",
    "mutmut==3.8.0",
    "tree-sitter==0.26.0",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-go==0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-objc==3.0.2",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-swift==0.7.3",
    "tree-sitter-zig==1.1.2",
]

[project.scripts]
crapkit = "crapkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Scheduling lives in tools/testing/run.py: four unit and eight E2E workers.
# Bare pytest stays serial for reproduction; the runner also accepts
# --unit-workers 1. No worker count is hidden in pytest's default arguments.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -p no:cacheprovider"
# A test still running after 600 s prints every thread's stack, which -q
# would otherwise leave as a missing dot. 600 is past hang_guard.HOLD_SECONDS,
# the longest a correct test holds a child.
faulthandler_timeout = 600

# tests/e2e runs most CLI calls inside the pytest worker, where they are
# measured like any test. The files that bind cli_runner(spawn=True), and every
# Python child crapkit starts, run in processes of their own, so without a
# subprocess measurement the code only they reach reads 0% and the gate fires
# on any function of it a diff touches. pytest-cov 7.0.0 dropped the mechanism that used to do this (its own
# `pytest-cov.pth` reading COV_CORE_*) and pointed at coverage's own patch
# system, added in coverage 7.10. Measured on tests/e2e/test_init_doctor_e2e.py:
# src/crapkit/cli/admin.py scores 0/498 statements under pytest-cov 7.1.0 with
# this key absent, and 317/498 with it present, on 7.1.0 and 6.3.0 alike.
# `parallel = true` follows automatically; .coverage* is already gitignored.
[tool.coverage.run]
patch = ["subprocess"]

# mutmut 3.8.0 runs in the accuracy image (tools/accuracy/mutation.py). The
# accuracy plan mutates every module a tests/accuracy/*/calcs.tsv row names;
# kit-close regenerates paths_to_mutate from that union, and
# tests/accuracy/kit/test_kit_contract.py fails from then on when the two
# differ. Until then it holds score.py, home of the canary mutant every shard
# must kill. also_copy carries the accuracy suite's data into mutmut's copy of
# the tree: fixtures, probes, recordings, goldens, the pins and the node oracles.
[tool.mutmut]
paths_to_mutate = ["src/crapkit/score.py"]
also_copy = ["tests/", "tools/accuracy/pins.toml", "tools/accuracy/node/",
             "tools/accuracy/checks/"]
