# pre-commit framework manifest: lets any consumer repo add the gate with
#   repos:
#     - repo: https://github.com/JeanFrancoisGagne/crapkit
#       rev: <tag>
#       hooks:
#         - id: crapkit-gate
- id: crapkit-gate
  name: crapkit complexity gate
  description: every staged new/edited function's ccn must sit at or under its scope ceiling, or, for a function the ratchet marks, at or under its mark
  entry: crapkit hook-precommit
  language: python
  pass_filenames: false
  always_run: true
