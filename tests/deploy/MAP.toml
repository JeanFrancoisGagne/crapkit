# --- channel and consumer pairs ------------------------------------------------------
# What finds crapkit when a consumer starts it: a git hook, the merge driver,
# a plugin's MCP server or hook. `consumer` is git or plugin. A pair with no
# cell names its reason.

[pairs]
"pip venv | Route 1 hook" = { consumer = "git", cell = "lin-gate-route1-sh" }
"pip venv | Route 2 hook" = { consumer = "git", cell = "lin-gate-route2" }
"pip venv | merge driver" = { consumer = "git", cell = "lin-merge-driver" }
"pip venv | pre-commit hook" = { consumer = "git", cell = "lin-precommit" }
"pipx | Route 1 hook" = { consumer = "git", cell = "lin-pair-pipx-route1" }
"uv tool | Route 2 hook" = { consumer = "git", cell = "lin-pair-uvtool-route2" }
"uvx | merge driver" = { consumer = "git", cell = "lin-pair-uvx-merge-driver" }
"python3 with no launcher | Route 1 hook" = { consumer = "git", cell = "lin-pair-python3-only" }
"user site and a venv | git hook" = { consumer = "git", cell = "lin-two-installs" }
"pipx | Route 2 hook" = { consumer = "git", reason = "the hook finds crapkit the way the Route 1 hook does, which lin-pair-pipx-route1 runs under pipx" }
"uv tool | Route 1 hook" = { consumer = "git", reason = "the hook finds crapkit the way the Route 2 hook does, which lin-pair-uvtool-route2 runs under uv tool" }
"uvx | Route 1 hook" = { consumer = "git", reason = "uvx installs no launcher, so the hook reaches crapkit through its uvx line, which docs-hook-line runs as uvx x route1" }
"Docker image | any git consumer" = { consumer = "git", reason = "the image serves MCP; the docs give no hook or driver line for it" }
"pip venv | Claude plugin" = { consumer = "plugin", cell = "lin-claude-plugin-fresh" }
"pip --user | Claude plugin" = { consumer = "plugin", cell = "lin-pipuser-path" }
"uv tool | Claude plugin" = { consumer = "plugin", cell = "win-uvtool-claude-plugin" }
"uvx | Claude plugin" = { consumer = "plugin", cell = "lin-pair-uvx-plugin" }
"user site and a venv | Claude plugin" = { consumer = "plugin", cell = "lin-two-installs" }
"pip venv | Codex plugin" = { consumer = "plugin", cell = "lin-codex-plugin-fresh" }
"pipx | Claude plugin" = { consumer = "plugin", reason = "pipx puts one launcher on PATH, the case lin-claude-plugin-fresh runs from a venv" }

