# --- what blocks a cell or a job -------------------------------------------------
# Each is work outside this packet (the kit, a cell no packet writes yet) or a
# runner that cannot take the cell. Delete the entry, and the `blocked` keys
# that name it, once the gap closes.

[gaps]
host-cells-unwritten = "no packet writes lin-host-up-docker-0.7.6, lin-devcontainer, lin-codex-cloud-sim or lin-podman yet; weekly-host names only the last two, and a run whose cells do not exist collects nothing, so pytest exits 5"
windows-nightly-packet-unscheduled = "nightly-windows-a and -b run one --packet each and name no 0.9.0 packet yet, since a run naming a packet whose module the tree lacks collects nothing and pytest exits 5; the ticket that adds one of these Windows cells' @cell adds its packet's run to nightly-windows-a or -b and drops the cell's `blocked` in the same change, and the last one deletes this gap"
windows-linux-containers = "the windows-2025 runner's Docker runs Windows containers only, so no CI job can build the Linux product image docs-docker-user serves; its Windows half runs on a Windows machine with Docker Desktop"

# --- deploy.yml's work ------------------------------------------------------------
# The scope job turns the event into a cadence and schedules every entry whose
# `when` holds it and that is not blocked. `runner` names the deploy.yml job
# that runs the entry: linux (containers), arm (containers on the arm64
# runner), windows, macos and host (native runs), tool (one command) or action
# (a job of the entry's own name). `runs` are run.py argument strings, one
# invocation each, {cadence} filled in; one that names cells or a packet must
# select a cell the tree holds, or pytest collects nothing and exits 5.
# `free_disk` deletes the runner's preinstalled SDKs first: an entry that
# builds full or an image on it needs it, since full takes 13.62 GB of the
# runner's disk. `timeout` is in minutes. No deploy.yml run has been measured
# yet; once one is, `measured` holds its minutes and the timeout is 1.5 times
# that, rounded up. An entry that builds core or ci passes --cache gha, unless
# it builds cold on purpose with --no-cache as lin-repeat does: a fresh runner
# holds no layers, and with --cache local it builds the image cold
# (tools/deploy/README.md, "The GitHub Actions cache").

[jobs.nightly-linux-core]
runner = "linux"
when = ["nightly", "release"]
runs = ["--cadence {cadence} --os linux --image core --cache gha -n 4"]
timeout = 45
measured = 0

# full and gui build cold each night. Each job builds every stage on its own
# runner, so its layers are new blobs, and cached beside core and ci the four
# images take 10.04 GB (measured 2026-09-25) of the GitHub Actions cache's
# 10 GB; past it GitHub evicts the least recently used entry, and an evicted
# core makes the push job's build cold. tools/deploy/README.md ("The GitHub
# Actions cache") has the sizes and the other ways to cache them.
[jobs.nightly-linux-full]
runner = "linux"
when = ["nightly", "release"]
runs = ["--cadence {cadence} --os linux --image full --cache local -n 4"]
free_disk = true
timeout = 90
measured = 0

[jobs.nightly-act]
runner = "linux"
when = ["nightly", "release"]
runs = ["--cadence {cadence} --os linux --image ci --cache gha -n 4"]
timeout = 40
measured = 0

[jobs.nightly-gui]
runner = "linux"
when = ["nightly", "release"]
runs = ["--cadence {cadence} --os linux --image gui --cache local -n 2"]
free_disk = true
nonblocking = true
timeout = 100
measured = 0

# A cold rebuild on a fresh runner, the push set twice from fresh containers,
# then the rebuilt image's toolchain held to image-manifest.lock.
[jobs.lin-repeat]
runner = "linux"
when = ["nightly", "release"]
runs = ["--cadence push --os linux --image core --no-cache --cache local --repeat 2 -n 4"]
then = "python tools/deploy/lock.py manifest --check --image crapkit-deploy:core"
timeout = 60
measured = 0

# Not in the release cadence: its cells check vVERSION out of GitHub, which
# holds that tag only once stage 2b pushes it (0.8.1's release run failed it
# with "git checkout v0.8.1 failed"). published-online runs after the push.
[jobs.weekly-online]
runner = "linux"
when = ["weekly"]
runs = ["--online --cadence {cadence} --os linux --image core --cache gha -n 4"]
timeout = 30
measured = 0

[jobs.published-online]
runner = "linux"
when = ["published"]
runs = ["--online --cadence published --os linux --image core --cache gha -n 4"]
timeout = 30
measured = 0

# The push set 400 days ahead: every process in the container reads the
# moved clock through libfaketime (run.py --faketime).
[jobs.lin-clock]
runner = "linux"
when = ["nightly", "release"]
runs = ["--cadence push --os linux --image core --cache gha --faketime +400d -n 4"]
timeout = 30
measured = 0

# full-latest is full with every harness at its newest release, rebuilt once
# an ISO week (22.1 GB unpacked); run.py writes latest-drift.txt beside the
# JUnit. A release runs it too: the docs must hold for the harnesses a user
# installs that day. --packet keeps it to the harness cells: without it the
# release cadence's `online` term also picked the five cells that need the
# tag, PyPI files and registry entry stage 2b has not pushed yet, and the
# weekly ran the three weekly-online cells a second time.
[jobs.latest-harnesses]
runner = "linux"
when = ["weekly", "release"]
runs = ["--online --cadence {cadence} --os linux --image full-latest --packet deploy-harnesses -n 4"]
free_disk = true
timeout = 60
measured = 0

[jobs.weekly-py315]
runner = "linux"
when = ["weekly", "release"]
runs = ["--cadence {cadence} --os linux --image core --cache gha --cell lin-py315-start"]
nonblocking = true
timeout = 20
measured = 0

# The cells image built for linux/arm64 on an arm64 runner, so nothing is
# emulated; lin-arm64 skips on an x86_64 machine.
[jobs.weekly-arm64]
runner = "arm"
when = ["weekly", "release"]
runs = ["--cadence {cadence} --os linux --image cells-arm64 --cell lin-arm64"]
nonblocking = true
timeout = 40
measured = 0

# Split by packet so each half fits its timeout; one run.py invocation per packet.
# A packet with a nightly Windows cell needs a run here: the reach check in
# test_deploy_workflows.py names each cell no run selects.
[jobs.nightly-windows-a]
runner = "windows"
when = ["nightly", "release"]
harness = "core"
runs = ["--native --os windows --cadence {cadence} --packet deploy-channels -n 4",
        "--native --os windows --cadence {cadence} --packet deploy-git -n 4",
        "--native --os windows --cadence {cadence} --packet deploy-upgrade -n 4",
        "--native --os windows --cadence {cadence} --packet deploy-fixes -n 4"]
timeout = 60
measured = 0

[jobs.nightly-windows-b]
runner = "windows"
when = ["nightly", "release"]
harness = "full"
runs = ["--native --os windows --cadence {cadence} --packet deploy-plugins -n 4",
        "--native --os windows --cadence {cadence} --packet deploy-harnesses -n 4",
        "--native --os windows --cadence {cadence} --packet deploy-kit -n 4"]
timeout = 60
measured = 0

[jobs.win-repeat]
runner = "windows"
when = ["nightly", "release"]
harness = "core"
runs = ["--native --os windows --cadence push --repeat 2 -n 4"]
timeout = 45
measured = 0

[jobs.weekly-macos]
runner = "macos"
when = ["weekly", "release"]
harness = "core"
runs = ["--native --os macos --cadence {cadence} -n 3"]
timeout = 45
measured = 0

# Both cells build an image from the root Dockerfile, which pulls its base
# over the network. Add each host cell here once a packet writes it.
[jobs.nightly-host]
runner = "host"
when = ["nightly", "release"]
runs = ["--native --os linux --online --cadence {cadence} --cell lin-host-docker-product --cell docs-docker-user"]
timeout = 30
measured = 0

[jobs.weekly-host]
runner = "host"
when = ["weekly", "release"]
runs = ["--native --os linux --cadence {cadence} --cell lin-codex-cloud-sim --cell lin-podman"]
blocked = "host-cells-unwritten"
timeout = 30
measured = 0

[jobs.lock-drift]
runner = "tool"
when = ["nightly", "release"]
command = "python tools/deploy/lock.py --check"
timeout = 10
measured = 0

# calibrate.py builds crapkit-deploy:full and runs the calibrate-all cell in it.
[jobs.calibrate-all]
runner = "tool"
when = ["weekly", "release"]
command = "python tools/deploy/calibrate.py --all"
free_disk = true
timeout = 30
measured = 0

[jobs.gha-action-container-job]
runner = "action"
when = ["nightly", "release"]
timeout = 15
measured = 0

[jobs.gha-action-tag-upgrade]
runner = "action"
when = ["nightly", "release"]
timeout = 15
measured = 0

[jobs.gha-action-windows]
runner = "action"
when = ["nightly", "release"]
timeout = 20
measured = 0

[jobs.published-action-tag]
runner = "action"
when = ["published"]
timeout = 15
measured = 0

# ci.yml's push jobs keep their timeouts in the workflow; these hold the same
# rule. deploy-linux's 40 minutes cover a cold build of the core image on a
# 4-core runner: the job that times out mid-build writes no cache, and every
# later run would start cold again.
[budget.deploy-linux]
timeout = 40
measured = 0

[budget.deploy-linux-native]
timeout = 15
measured = 0

# Unmeasured on the windows-2025 runner: no deploy run has reached GitHub
# yet. On a loaded 24-core Windows machine the push set's `npm ci` of the 420
# fixture packages took 2 to 3 minutes, once per session, so the first run
# may need more than 20. Its minutes go in `measured`, and the timeout becomes
# 1.5 times that.
[budget.deploy-windows]
timeout = 20
measured = 0

[budget.deploy-action]
timeout = 10
measured = 0

# --- the pull-request scope ---------------------------------------------------------
# A pull request runs the nightly set when its diff touches one of these paths,
# and every cadence (the release set) when it carries the label.

[scope]
label = "deploy-full"
schedules = { "17 6 * * *" = "nightly", "17 7 * * 1" = "weekly" }
paths = [
    "README.md", "CHANGELOG.md", "AGENTS.md", "Dockerfile", ".dockerignore", "action.yml", "pyproject.toml",
    "server.json", ".pre-commit-hooks.yaml", ".claude-plugin/", "plugin/", "git-hooks/", "docs/",
    "tools/action/", "tools/deploy/", "tools/release/", "tests/deploy/", ".github/workflows/deploy.yml",
    "src/crapkit/__init__.py", "src/crapkit/__main__.py", "src/crapkit/cli/", "src/crapkit/doctor.py",
    "src/crapkit/scaffold.py", "src/crapkit/hook.py", "src/crapkit/merge.py", "src/crapkit/mcp_server.py",
    "src/crapkit/_mcp_stdio.py", "src/crapkit/store.py", "src/crapkit/ratchetfile.py",
]

