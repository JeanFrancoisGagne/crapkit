# What the deploy suite covers, and what it leaves out on purpose.
#
# Every install channel, harness, upgrade source, piece of repo state, use
# case, channel-and-consumer pair and open question about a harness maps here
# to the cells that exercise it, or to an exclusion with its reason. Every
# documented command a user copies maps to cells or to an exclusion under
# [[doc]]. tests/unit/test_deploy_map.py holds this file to the docs and to
# the @cell decorators in tests/deploy; tests/unit/test_deploy_workflows.py
# holds [jobs] to .github/workflows/deploy.yml and proves each cell reaches a
# job on every cadence it names.
#
# A cell id is the one its @cell decorator names. A cell that pytest runs
# carries the markers run.py selects on: its cadence, its os, and image_<image>
# when it runs in a container. A cell with no image runs on the host (native,
# or next to the host's Docker daemon), so a container run never picks it up.
# A cell whose `job` names a workflow job is that job: a real GitHub runner
# drives it, not pytest.
#
# `blocked` names the kit gap that keeps a cell or a job from running today.
# The scope job never schedules a blocked job, and a blocked cell is exempt
# from the reach check until the gap closes.

# --- packets ------------------------------------------------------------------
# The packet that writes each cell, and the files that show it has landed in
# this tree. Until one of a packet's modules exists, the map's check that each
# of its cells has a @cell skips with the packet's name.

[packets.deploy-kit]
modules = ["tests/deploy/test_kit_isolation.py", "tests/deploy/test_kit_pieces.py",
           "tests/deploy/test_kit_upgrade_smoke.py"]

[packets.deploy-channels]
modules = ["tests/deploy/test_fresh_start.py", "tests/deploy/test_lockfile_templates.py",
           "tests/deploy/test_agent_loop.py", "tests/deploy/test_mcp_all_tools.py",
           "tests/deploy/test_fresh_channels.py", "tests/deploy/test_docker_product.py",
           "tests/deploy/test_registry_entry.py", "tests/deploy/test_launcher_lock.py",
           "tests/deploy/test_follow_hints.py", "tests/deploy/test_handbook_workflows.py",
           "tests/deploy/test_uninstall.py"]

[packets.deploy-git]
modules = ["tests/deploy/test_commit_gate.py", "tests/deploy/test_precommit.py",
           "tests/deploy/test_merge_driver.py", "tests/deploy/test_ci_route4.py", "tests/deploy/test_pairs.py",
           "tests/deploy/test_teammate_clone.py", "tests/deploy/test_repo_shapes.py",
           "tests/deploy/test_override_commit.py"]

[packets.deploy-upgrade]
modules = ["tests/deploy/test_upgrade_guide.py", "tests/deploy/test_upgrade_channels.py",
           "tests/deploy/test_upgrade_mcp_restart.py", "tests/deploy/test_upgrade_live_server.py",
           "tests/deploy/test_upgrade_chain.py", "tests/deploy/test_upgrade_git_sources.py",
           "tests/deploy/test_downgrade.py", "tests/deploy/test_skew.py", "tests/deploy/test_two_installs.py",
           "tests/deploy/test_lizard_only.py"]

[packets.deploy-plugins]
modules = ["tests/deploy/test_claude_plugin.py", "tests/deploy/test_codex_plugin.py",
           "tests/deploy/test_plugin_drift.py", "tests/deploy/test_skills.py", "tests/deploy/test_agent_sdk.py",
           "tests/deploy/test_claude_hook_stub.py", "tests/deploy/test_plugin_pairs.py",
           "tests/deploy/test_online_marketplaces.py"]

[packets.deploy-harnesses]
modules = ["tests/deploy/test_harness_profiles.py", "tests/deploy/test_harness_hooks_sim.py",
           "tests/deploy/test_harness_real_cli.py", "tests/deploy/test_harness_calls.py",
           "tests/deploy/test_cursor_claude_import.py", "tests/deploy/test_copilot_plugin_hooks.py",
           "tests/deploy/test_gui_harnesses.py"]
scripts = ["tools/deploy/calibrate.py"]

[packets.deploy-action]
modules = ["tests/deploy/test_action_act.py"]
scripts = ["tools/deploy/consumer.py", "tools/deploy/assert_action.py"]

# The workflow jobs in .github/workflows/ci.yml and deploy.yml.
[packets.deploy-ci]
modules = []

# The plan lists these cells, and no packet's module writes them yet.
[packets.unowned]
modules = []

