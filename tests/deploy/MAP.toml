published-action-tag = { packet = "deploy-action", cadence = "published", job = "deploy.yml:published-action-tag" }

# --- what blocks a cell or a job -------------------------------------------------
# Each is a kit change outside this packet. Delete the entry, and the `blocked`
# keys that name it, once the gap closes.

[gaps]
linux-toolchain = "tools/deploy/toolchain.py has no Linux uv or Node pin (pins.toml [binary] holds Windows and macOS rows only), so a native run on the ubuntu runner stops before any cell"
faketime = "the images hold no libfaketime, and neither run.py nor the sandbox passes FAKETIME or LD_PRELOAD to a cell"
arm64 = "run.py builds linux/amd64 only, and the Dockerfile downloads x86_64 binaries only"
prerelease-python = "run.py passes PYTHON_PRERELEASE empty, so no image holds CPython 3.15"
latest-mode = "run.py has no switch that installs each harness at its latest release in place of its pin"

# --- deploy.yml's work ------------------------------------------------------------
# The scope job turns the event into a cadence and schedules every entry whose
# `when` holds it and that is not blocked. `runner` names the deploy.yml job
# that runs the entry: linux (containers), windows, macos and host (native
# runs), tool (one command) or action (a job of the entry's own name). `runs`
# are run.py argument strings, one invocation each, {cadence} filled in.
# `timeout` is in minutes. Once a first run is measured, `measured` holds its
# minutes and the timeout is 1.5 times that, rounded up.

[jobs.nightly-linux-core]
runner = "linux"
when = ["nightly", "release"]
runs = ["--cadence {cadence} --os linux --image core --cache gha -n 4"]
timeout = 45
measured = 0

# full and gui build cold each night: with core and ci, the four compressed
# images pass the GitHub Actions cache's 10 GB, and an evicted core makes the
# push job's build cold.
[jobs.nightly-linux-full]
runner = "linux"
when = ["nightly", "release"]
runs = ["--cadence {cadence} --os linux --image full --cache local -n 4"]
free_disk = true
timeout = 90
measured = 0

[jobs.nightly-act]
runner = "linux"
when = ["nightly", "release"]
runs = ["--cadence {cadence} --os linux --image ci --cache gha -n 4"]
timeout = 40
measured = 0

[jobs.nightly-gui]
runner = "linux"
when = ["nightly", "release"]
runs = ["--cadence {cadence} --os linux --image gui --cache local -n 2"]
free_disk = true
nonblocking = true
timeout = 100
measured = 0

# A cold rebuild on a fresh runner, the push set twice from fresh containers,
# then the rebuilt image's toolchain held to image-manifest.lock.
[jobs.lin-repeat]
runner = "linux"
when = ["nightly", "release"]
runs = ["--cadence push --os linux --image core --no-cache --cache local --repeat 2 -n 4"]
then = "python tools/deploy/lock.py manifest --check --image crapkit-deploy:core"
timeout = 60
measured = 0

[jobs.weekly-online]
runner = "linux"
when = ["weekly", "release"]
runs = ["--online --cadence {cadence} --os linux --image core -n 4"]
timeout = 30
measured = 0

[jobs.published-online]
runner = "linux"
when = ["published"]
runs = ["--online --cadence published --os linux --image core -n 4"]
timeout = 30
measured = 0

[jobs.lin-clock]
runner = "linux"
when = ["nightly", "release"]
runs = ["--cadence push --os linux --image core -n 4"]
blocked = "faketime"
timeout = 30
measured = 0

[jobs.latest-harnesses]
runner = "linux"
when = ["weekly"]
runs = ["--online --cadence {cadence} --os linux --image full -n 4"]
blocked = "latest-mode"
timeout = 60
measured = 0

[jobs.weekly-py315]
runner = "linux"
when = ["weekly", "release"]
runs = ["--cadence {cadence} --os linux --image core --cell lin-py315-start"]
blocked = "prerelease-python"
nonblocking = true
timeout = 20
measured = 0

[jobs.weekly-arm64]
runner = "linux"
when = ["weekly", "release"]
runs = ["--cadence {cadence} --os linux --image cells --cell lin-arm64"]
blocked = "arm64"
nonblocking = true
timeout = 40
measured = 0

# Split by packet so each half fits its timeout; one run.py invocation per packet.
[jobs.nightly-windows-a]
runner = "windows"
when = ["nightly", "release"]
harness = "core"
runs = ["--native --os windows --cadence {cadence} --packet deploy-channels -n 4",
        "--native --os windows --cadence {cadence} --packet deploy-git -n 4",
        "--native --os windows --cadence {cadence} --packet deploy-upgrade -n 4"]
timeout = 60
measured = 0

[jobs.nightly-windows-b]
runner = "windows"
when = ["nightly", "release"]
harness = "full"
runs = ["--native --os windows --cadence {cadence} --packet deploy-plugins -n 4",
        "--native --os windows --cadence {cadence} --packet deploy-harnesses -n 4",
        "--native --os windows --cadence {cadence} --packet deploy-kit -n 4"]
timeout = 60
measured = 0

[jobs.win-repeat]
runner = "windows"
when = ["nightly", "release"]
harness = "core"
runs = ["--native --os windows --cadence push --repeat 2 -n 4"]
timeout = 45
measured = 0

[jobs.weekly-macos]
runner = "macos"
when = ["weekly", "release"]
harness = "core"
runs = ["--native --os macos --cadence {cadence} -n 3"]
timeout = 45
measured = 0

[jobs.nightly-host]
runner = "host"
when = ["nightly", "release"]
runs = ["--native --os linux --cadence {cadence} --cell lin-host-docker-product --cell lin-host-up-docker-0.7.6 --cell lin-devcontainer"]
blocked = "linux-toolchain"
timeout = 30
measured = 0

[jobs.weekly-host]
runner = "host"
when = ["weekly", "release"]
runs = ["--native --os linux --cadence {cadence} --cell lin-codex-cloud-sim --cell lin-podman"]
blocked = "linux-toolchain"
timeout = 30
measured = 0

[jobs.lock-drift]
runner = "tool"
when = ["nightly", "release"]
command = "python tools/deploy/lock.py --check"
timeout = 10
measured = 0

[jobs.calibrate-all]
runner = "tool"
when = ["weekly", "release"]
command = "python tools/deploy/calibrate.py --all"
timeout = 30
measured = 0

[jobs.gha-action-container-job]
runner = "action"
when = ["nightly", "release"]
timeout = 15
measured = 0

[jobs.gha-action-tag-upgrade]
runner = "action"
when = ["nightly", "release"]
timeout = 15
measured = 0

[jobs.gha-action-windows]
runner = "action"
when = ["nightly", "release"]
timeout = 20
measured = 0

[jobs.published-action-tag]
runner = "action"
when = ["published"]
timeout = 15
measured = 0

# ci.yml's push jobs keep their timeouts in the workflow; these hold the same
# rule. deploy-linux's 40 minutes cover a cold build of the core image on a
# 4-core runner: the job that times out mid-build writes no cache, and every
# later run would start cold again.
[budget.deploy-linux]
timeout = 40
measured = 0

[budget.deploy-linux-native]
timeout = 15
measured = 0

# Unmeasured on the windows-2025 runner. The first run's minutes go in
# `measured`, and the timeout becomes 1.5 times that.
[budget.deploy-windows]
timeout = 20
measured = 0

[budget.deploy-action]
timeout = 10
measured = 0

# --- the pull-request scope ---------------------------------------------------------
# A pull request runs the nightly set when its diff touches one of these paths,
# and every cadence (the release set) when it carries the label.

[scope]
label = "deploy-full"
schedules = { "17 6 * * *" = "nightly", "17 7 * * 1" = "weekly" }
paths = [
    "README.md", "CHANGELOG.md", "AGENTS.md", "Dockerfile", ".dockerignore", "action.yml", "pyproject.toml",
    "server.json", ".pre-commit-hooks.yaml", ".claude-plugin/", "plugin/", "git-hooks/", "docs/",
    "tools/action/", "tools/deploy/", "tools/release/", "tests/deploy/", ".github/workflows/deploy.yml",
    "src/crapkit/__init__.py", "src/crapkit/__main__.py", "src/crapkit/cli/", "src/crapkit/doctor.py",
    "src/crapkit/scaffold.py", "src/crapkit/hook.py", "src/crapkit/merge.py", "src/crapkit/mcp_server.py",
    "src/crapkit/_mcp_stdio.py", "src/crapkit/store.py", "src/crapkit/ratchetfile.py",
]

