# What the deploy suite covers, and what it leaves out on purpose.
#
# Every install channel, harness, upgrade source, piece of repo state, use
# case, channel-and-consumer pair and open question about a harness maps here
# to the cells that exercise it, or to an exclusion with its reason. Every
# documented command a user copies maps to cells or to an exclusion under
# [[doc]]. tests/unit/test_deploy_map.py holds this file to the docs and to
# the @cell decorators in tests/deploy; tests/unit/test_deploy_workflows.py
# holds [jobs] to .github/workflows/deploy.yml and proves each cell reaches a
# job on every cadence it names.
#
# A cell id is the one its @cell decorator names. A cell that pytest runs
# carries the markers run.py selects on: its cadence, its os, and image_<image>
# when it runs in a container. `os` is a list for a cell whose tests run on
# each OS it names (in a container on Linux, natively on Windows), and a job
# must select it on each. A cell with no image runs on the host (native, or
# next to the host's Docker daemon), so a container run never picks it up.
# Several tests may share a cell id: the map gives the cadences they run on
# between them ("push+nightly"), and each test runs on one of those.
# A cell whose `job` names a workflow job is that job: a real GitHub runner
# drives it. When a test also models the job (under act, or through
# calibrate.py), the entry gives that test's os and image too.
#
# `blocked` names the gap that keeps a cell or a job from running today, or,
# as { <os> = "<gap>" }, the one OS of a cell no runner can take. The scope
# job never schedules a blocked job, and a blocked cell (or OS) is exempt from
# the reach check until the gap closes.
#
# [every_harness] holds the every-harness rows: a set of cells that runs under
# each harness tools/deploy/pins.toml pins, in that harness's image, fresh and
# upgrade. An entry is keyed by the ticket whose cells make up the row, or
# "<ticket>/<part>" where one ticket's row splits, and has one key: nightly =
# "all" runs the row on all 17 harnesses nightly, nightly = "core" on the 3
# core-image harnesses only. A test of a row names its entry with
# @cell(..., row="<key>"), and its [cell] entry carries the same `row`. A key
# no [cell] entry names yet is pending: its ticket has not added its cells,
# and test_deploy_map.py's row check skips it, naming it. A nightly run
# (run.py passes --deploy-cadence) drops a `core` row's items on the full
# image and the images built on it (gui, full-latest), where the 14 non-core
# harnesses run. Every other cadence, the release candidate's release run
# included, keeps every row on every harness.

# --- packets ------------------------------------------------------------------
# The packet that writes each cell, and the files that show it has landed in
# this tree. Until one of a packet's modules exists, the map's check that each
# of its cells has a @cell skips with the packet's name.

[packets.deploy-kit]
modules = ["tests/deploy/test_kit_isolation.py", "tests/deploy/test_kit_pieces.py",
           "tests/deploy/test_kit_upgrade_smoke.py"]

