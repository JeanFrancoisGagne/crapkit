# Goose: the harness profile the deploy cells read (tests/deploy/kit/profiles.py).
name = "Goose"
kind = "cli"

# docs/harnesses.md > the heading below; `config` stands in until that page carries the section.
[doc]
heading = "Goose"
format = "goose-yaml"
scope = "user"
path = ".config/goose/config.yaml"
# GOOSE_PATH_ROOT, when set, moves the file to <root>/config/config.yaml.
env_root = "GOOSE_PATH_ROOT"
env_path = "config/config.yaml"
config = '''
extensions:
  crapkit:
    name: crapkit
    type: stdio
    cmd: crapkit
    args: [mcp, --repo, /absolute/path/to/your/repo]
    enabled: true
    timeout: 300
'''

# How the harness starts `crapkit mcp`: working directory, environment, command lookup (POSIX, Windows).
[spawn]
cwd = "workspace"
env = "inherit"
resolve = "execvp"
windows = "createprocess"

# What it sends first, and the client a sim cell drives crapkit with.
[initialize]
client = "python"
sdk = ""
protocol = "2025-11-25"
discover_first = true
client_name = "goose-cli"

# What it keeps of one tool result (0: none known), its tool-name prefix, its startup bound.
[limits]
output_tokens = 0
tool_prefix = "crapkit__"
startup_seconds = 300

# What it does with the plugin's hooks/hooks.json.
[hooks]
loads = "none"
manifest = ""
fields = []
events = []
matcher = "dropped"
exit2 = "ignored"

# The pinned CLI a real cell runs; pins_key "" means no headless check exists.
[real_cli]
pins_key = "goose"
version = "1.52.0"
command = "goose"
image = "full"
floor = ""
headless = "goose run --with-extension against the OpenAI stub"
login = false

# What a user does after upgrading crapkit.
[lifecycle]
restart = "start a new session"
autoupgrade = false

# One tag per field above: observed, source, docs or inferred.
[evidence]
"spawn.cwd" = "observed"
"spawn.env" = "observed"
"spawn.resolve" = "observed"
"spawn.windows" = "inferred"
"initialize.client" = "source"
"initialize.sdk" = "source"
"initialize.protocol" = "observed"
"initialize.discover_first" = "observed"
"initialize.client_name" = "observed"
"limits.output_tokens" = "inferred"
"limits.tool_prefix" = "observed"
"limits.startup_seconds" = "docs"
"hooks.loads" = "docs"
"hooks.manifest" = "docs"
"hooks.fields" = "docs"
"hooks.events" = "docs"
"hooks.matcher" = "docs"
"hooks.exit2" = "docs"
sources = ["calibrate.py: shim record of `goose run` on the OpenAI stub (server/discover 2026-07-28, then initialize 2025-11-25)", "https://block.github.io/goose/docs/getting-started/using-extensions (extensions in config.yaml)"]
