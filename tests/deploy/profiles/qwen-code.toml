# Qwen Code: the harness profile the deploy cells read (tests/deploy/kit/profiles.py).
name = "Qwen Code"
kind = "cli"

# docs/harnesses.md > the heading below; `config` stands in until that page carries the section.
[doc]
heading = "Qwen Code"
format = "mcpservers-json"
# User scope: Qwen Code 0.24.5 lists a server from the project's .qwen/settings.json
# as "Pending approval" and does not start it.
scope = "user"
path = ".qwen/settings.json"
config = '''
{
  "mcpServers": {
    "crapkit": {
      "command": "crapkit",
      "args": [
        "mcp",
        "--repo",
        "/absolute/path/to/your/repo"
      ]
    }
  }
}
'''

# How the harness starts `crapkit mcp`: working directory, environment, command lookup (POSIX, Windows).
[spawn]
cwd = "workspace"
env = "inherit"
resolve = "execvp"
windows = "cross-spawn"

# What it sends first, and the client a sim cell drives crapkit with.
[initialize]
client = "ts-sdk"
# The kit's newest SDK alias: 0.24.5 offers 2025-11-25, which sdk-1-23 and later speak.
sdk = "sdk-1-29"
protocol = "2025-11-25"
discover_first = false
client_name = "mcp-test-client"

# What it keeps of one tool result (0: none known), its tool-name prefix, its startup bound.
[limits]
output_tokens = 0
tool_prefix = ""
startup_seconds = 600

# What it does with the plugin's hooks/hooks.json.
[hooks]
loads = "none"
manifest = ""
fields = []
events = []
matcher = "dropped"
exit2 = "ignored"

# The pinned CLI a real cell runs; pins_key "" means no headless check exists.
[real_cli]
pins_key = ""
version = "latest"
command = "qwen"
image = ""
floor = ""
headless = "qwen mcp list"
login = false
latest = "weekly calibrate-all"

# What a user does after upgrading crapkit.
[lifecycle]
restart = "`/mcp refresh`"
autoupgrade = true

# One tag per field above: observed, source, docs or inferred.
[evidence]
"spawn.cwd" = "observed"
"spawn.env" = "observed"
"spawn.resolve" = "inferred"
"spawn.windows" = "inferred"
"initialize.client" = "inferred"
"initialize.sdk" = "inferred"
"initialize.protocol" = "observed"
"initialize.discover_first" = "observed"
"initialize.client_name" = "observed"
"limits.output_tokens" = "inferred"
"limits.tool_prefix" = "inferred"
"limits.startup_seconds" = "inferred"
"hooks.loads" = "inferred"
"hooks.manifest" = "inferred"
"hooks.fields" = "inferred"
"hooks.events" = "inferred"
"hooks.matcher" = "inferred"
"hooks.exit2" = "inferred"
sources = ["a Gemini CLI fork: each value is Gemini CLI's until calibrate-all observes the latest release", "calibrate-all against qwen 0.24.5: `qwen mcp list` shows a server from the project's .qwen/settings.json as 'Pending approval' and never starts it", "calibrate-all against qwen 0.24.5 with the server in ~/.qwen/settings.json: `qwen mcp list` starts it in the workspace with its own environment and offers 2025-11-25 as mcp-test-client (its connection test, as Gemini CLI's)"]
