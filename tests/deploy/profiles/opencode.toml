# OpenCode: the harness profile the deploy cells read (tests/deploy/kit/profiles.py).
name = "OpenCode"
kind = "cli"

# docs/harnesses.md > the heading below; `config` stands in until that page carries the section.
[doc]
heading = "OpenCode"
format = "opencode-json"
scope = "project"
path = "opencode.json"
config = '''
{
  "$schema": "https://opencode.ai/config.json",
  "mcp": {
    "crapkit": {
      "type": "local",
      "command": [
        "crapkit",
        "mcp",
        "--repo",
        "/absolute/path/to/your/repo"
      ]
    }
  }
}
'''

# How the harness starts `crapkit mcp`: working directory, environment, command lookup (POSIX, Windows).
[spawn]
cwd = "workspace"
env = "inherit"
resolve = "execvp"
windows = "cross-spawn"

# What it sends first, and the client a sim cell drives crapkit with.
[initialize]
client = "ts-sdk"
sdk = "sdk-1-29"
protocol = "2025-11-25"
discover_first = false
client_name = "opencode"

# What it keeps of one tool result (0: none known), its tool-name prefix, its startup bound.
[limits]
output_tokens = 0
tool_prefix = "crapkit_"
startup_seconds = 0

# What it does with the plugin's hooks/hooks.json.
[hooks]
loads = "none"
manifest = ""
fields = []
events = []
matcher = "dropped"
exit2 = "ignored"

# The pinned CLI a real cell runs; pins_key "" means no headless check exists.
[real_cli]
pins_key = "opencode"
version = "1.18.32"
command = "opencode"
image = "full"
floor = ""
headless = "opencode mcp list"
login = false

# What a user does after upgrading crapkit.
[lifecycle]
restart = "restart opencode"
autoupgrade = true

# One tag per field above: observed, source, docs or inferred.
[evidence]
"spawn.cwd" = "observed"
"spawn.env" = "observed"
"spawn.resolve" = "observed"
"spawn.windows" = "inferred"
"initialize.client" = "inferred"
"initialize.sdk" = "inferred"
"initialize.protocol" = "observed"
"initialize.discover_first" = "observed"
"initialize.client_name" = "observed"
"limits.output_tokens" = "inferred"
"limits.tool_prefix" = "observed"
"limits.startup_seconds" = "inferred"
"hooks.loads" = "docs"
"hooks.manifest" = "docs"
"hooks.fields" = "docs"
"hooks.events" = "docs"
"hooks.matcher" = "docs"
"hooks.exit2" = "docs"
sources = ["calibrate.py: shim record of `opencode mcp list` in crapkit-deploy:full", "https://opencode.ai/docs/mcp-servers (mcp.<name>.type local, command array)", "OpenCode plugins are JavaScript modules; it reads no Claude hooks.json"]
