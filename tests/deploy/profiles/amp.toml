# Amp: the harness profile the deploy cells read (tests/deploy/kit/profiles.py).
name = "Amp"
kind = "cli"

# docs/harnesses.md > the heading below; `config` stands in until that page carries the section.
[doc]
heading = "Amp"
format = "amp-json"
scope = "user"
path = ".config/amp/settings.json"
config = '''
{
  "amp.mcpServers": {
    "crapkit": {
      "command": "crapkit",
      "args": [
        "mcp",
        "--repo",
        "/absolute/path/to/your/repo"
      ]
    }
  }
}
'''

# How the harness starts `crapkit mcp`: working directory, environment, command lookup (POSIX, Windows).
[spawn]
cwd = "workspace"
env = "inherit"
resolve = "execvp"
windows = "cross-spawn"

# What it sends first, and the client a sim cell drives crapkit with.
[initialize]
client = "ts-sdk"
sdk = "sdk-1-29"
protocol = "2025-11-25"
discover_first = false
client_name = "amp-mcp-client"

# What it keeps of one tool result (0: none known), its tool-name prefix, its startup bound.
[limits]
output_tokens = 0
tool_prefix = ""
startup_seconds = 0

# What it does with the plugin's hooks/hooks.json.
[hooks]
loads = "none"
manifest = ""
fields = []
events = []
matcher = "dropped"
exit2 = "ignored"

# The pinned CLI a real cell runs; pins_key "" means no headless check exists.
[real_cli]
pins_key = "amp"
version = "0.0.1790265644-gf7438f"
command = "amp"
image = "full"
floor = ""
headless = "amp mcp doctor crapkit"
login = false
env = { AMP_API_KEY = "sgamp_user_deploy_cell" }

# What a user does after upgrading crapkit.
[lifecycle]
restart = "start a new thread"
autoupgrade = true

# One tag per field above: observed, source, docs or inferred.
[evidence]
"spawn.cwd" = "observed"
"spawn.env" = "observed"
"spawn.resolve" = "observed"
"spawn.windows" = "inferred"
"initialize.client" = "inferred"
"initialize.sdk" = "inferred"
"initialize.protocol" = "observed"
"initialize.discover_first" = "observed"
"initialize.client_name" = "observed"
"limits.output_tokens" = "inferred"
"limits.tool_prefix" = "inferred"
"limits.startup_seconds" = "inferred"
"hooks.loads" = "inferred"
"hooks.manifest" = "inferred"
"hooks.fields" = "inferred"
"hooks.events" = "inferred"
"hooks.matcher" = "inferred"
"hooks.exit2" = "inferred"
sources = ["calibrate.py: shim record of `amp mcp doctor crapkit` in crapkit-deploy:full", "`amp mcp doctor` with no AMP_API_KEY starts a browser login; any key value lets it check offline"]
