# The accuracy corpus: what every golden, cross-platform digest and wheel diff runs on.
#
# [small] is the small corpus under small/, committed in this repository. kit.corpus_run
# commits it to a fresh repo at kit.repos.EPOCH (2025-06-15T15:06:40Z) and freezes git's
# clock at git_test_date_now, one day later, so the 12-month churn window never moves with
# the calendar. [history] is the synthetic 60-commit history in history/small.bundle,
# whose last commit is the small corpus tree; its runs freeze the clock one day after it.
#
# [member.*] is the full corpus. tools/accuracy/corpus.py builds each member from a
# partial shallow clone of `url` at `commit`, keeps only `paths` (plus `license`), and
# refuses a path whose git object id at that commit is not the one in `trees`. A member
# with `history_since` also keeps its real history from that date as a bundle.
# `slice` names the files the small corpus copies under small/vendor/<member>/ with the
# license. `pins` prints the trees and epoch lines when a commit moves:
#   python tools/accuracy/corpus.py pins --member <name>
# The full corpus is published once per `corpus.py digest` as the prerelease asset
# corpus-<digest> on the crapkit repository.
#
# Kotlin has no member: crapkit declares no Kotlin suffix (LANGUAGE_EXTENSIONS).

[small]
git_test_date_now = 1750086400

[history]
bundle = "history/small.bundle"
git_test_date_now = 1750086400

