[crapkit]
target = 6
alert_command = "python append_alert.py"

[[scope]]
name = "src"
paths = ["src"]
languages = ["typescript"]

[[scope]]
name = "py"
paths = ["pylib"]
languages = ["python"]

[exclude]
globs = ["**/node_modules/**", "**/*.test.ts", "**/test_*.py", "make_cov.py", "append_alert.py"]

# The suite's own subprocess coverage skips each lane child: nothing measures
# this fixture's tooling. An empty COVERAGE_PROCESS_CONFIG disarms coverage's
# hook (pytest-cov 7), an empty COV_CORE_DATAFILE pytest-cov 6's.
[[lane]]
name = "unit"
command = "python make_cov.py"
artifact = "coverage/coverage-final.json"
parser = "istanbul"
scopes = ["src"]
env = { COVERAGE_PROCESS_CONFIG = "", COV_CORE_DATAFILE = "" }

[[lane]]
name = "py"
command = "python -m pytest pylib -n 0 -p no:cacheprovider --cov=pylib --cov-branch --cov-report=json:coverage-py.json --junitxml=junit.xml -q"
artifact = "coverage-py.json"
parser = "coveragepy"
scopes = ["py"]
full_suite = false
results_artifact = "junit.xml"
env = { COVERAGE_PROCESS_CONFIG = "", COV_CORE_DATAFILE = "" }
